<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef9fc">
<title>My Books v1.2</title>

<style>
:root{
  --accent:#37bfd0;
  --accent-dark:#159daf;
  --soft:#e9f8fb;
  --bg:#f7fafb;
  --paper:#fff;
  --text:#222;
  --muted:#8b9296;
  --line:#e5e9ea;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit}
.hidden{display:none!important}

/* ---------- HEADER ---------- */

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}

.topin{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:env(safe-area-inset-top) 18px 0;
}

.ttl{
  font-size:20px;
  font-weight:750;
}

.back{
  min-width:70px;
  text-align:left;
  font-size:16px;
  color:var(--accent-dark);
  font-weight:650;
}

.topright{
  min-width:70px;
  display:flex;
  justify-content:flex-end;
}

.iconbtn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  font-size:25px;
}

/* ---------- COMMON ---------- */

.page{
  max-width:850px;
  margin:auto;
  padding:22px 18px 100px;
}

.primary{
  background:var(--accent);
  color:#fff;
  padding:11px 17px;
  border-radius:8px;
  font-weight:700;
}

.secondary{
  background:#fff;
  border:1px solid var(--line);
  padding:10px 15px;
  border-radius:8px;
  font-weight:650;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

/* ---------- SHELF ---------- */

.shelfHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.shelfTitle{
  font-size:14px;
  font-weight:700;
  color:#596267;
}

.addBook{
  color:var(--accent-dark);
  font-size:15px;
  font-weight:700;
}

.filters{
  display:flex;
  gap:4px;
  overflow:auto;
  margin:0 -18px 22px;
  padding:0 18px 11px;
  border-bottom:1px solid var(--line);
}

.pill{
  border-radius:4px;
  padding:8px 15px;
  white-space:nowrap;
  font-size:14px;
  color:#697176;
}

.pill.on{
  background:var(--accent);
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:25px 13px;
}

@media(max-width:380px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(min-width:700px){
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}

.book{
  min-width:0;
  cursor:pointer;
}

.cover{
  aspect-ratio:2/3;
  overflow:hidden;
  background:linear-gradient(145deg,#dff3f5,#acdce2);
  box-shadow:0 3px 9px #0002;
  display:flex;
  align-items:flex-end;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.cover span{
  width:100%;
  padding:11px;
  color:#234;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:700;
  font-size:14px;
  word-break:break-word;
}

.bn{
  font-size:14px;
  font-weight:700;
  margin-top:8px;
  line-height:1.35;
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

/* ---------- BOOK DETAIL ---------- */

.detailCard{
  background:white;
  border-bottom:1px solid var(--line);
  margin:-22px -18px 0;
  padding:22px 18px;
}

.detail{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:17px;
  align-items:start;
}

.detail .cover{
  width:105px;
}

.dname{
  font-size:20px;
  font-weight:800;
  margin:0 0 5px;
}

.stats{
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
}

.sectionTitle{
  font-size:14px;
  color:#5c666b;
  font-weight:700;
  margin:24px 0 10px;
}

.vol{
  background:#fff;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}

.vh{
  padding:14px 4px;
  font-size:16px;
  font-weight:750;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.vcount{
  font-size:11px;
  font-weight:400;
  color:var(--muted);
}

.ch{
  padding:14px 5px;
  border-top:1px solid var(--line);
  display:flex;
  gap:10px;
  align-items:center;
}

.cm{
  flex:1;
  min-width:0;
}

.ct{
  font-size:15px;
  font-weight:700;
}

.preview{
  font-size:12px;
  color:#8a9194;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:5px;
}

.cc{
  font-size:11px;
  color:#9ba0a3;
  white-space:nowrap;
}

.chevron{
  color:#aaa;
  font-size:20px;
}

/* ---------- READER ---------- */

.reader{
  min-height:100vh;
  background:#fff;
}

.reader .top{
  background:rgba(255,255,255,.97);
}

.rb{
  max-width:760px;
  margin:auto;
  padding:28px 26px 125px;
}

.text{
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    serif;

  font-size:20px;
  line-height:2;
  letter-spacing:.035em;
  white-space:pre-wrap;
  overflow-wrap:break-word;
}

/* 縦書き */

.text.vert{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  height:calc(100vh - 165px);
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  line-height:2;
  padding:4px 5px;
}

/* ---------- READER CONTROLS ---------- */

.controls{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:calc(14px + env(safe-area-inset-bottom));
  transform:translateX(-50%);

  display:flex;
  align-items:center;
  gap:3px;

  background:rgba(255,255,255,.94);
  border:1px solid #e1e4e5;
  border-radius:8px;
  padding:5px;

  box-shadow:0 3px 14px #00000012;
  backdrop-filter:blur(12px);
  white-space:nowrap;
}

.controls button{
  padding:8px 10px;
  border-radius:5px;
  font-size:13px;
}

.controls .on{
  background:var(--soft);
  color:var(--accent-dark);
  font-weight:700;
}

/* ---------- MODAL ---------- */

.modalback{
  position:fixed;
  inset:0;
  background:#0005;
  z-index:100;
  display:flex;
  align-items:flex-end;
}

.modal{
  width:100%;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px 18px 0 0;
  padding:22px 20px calc(25px + env(safe-area-inset-bottom));
}

.modal h2{
  margin:0 0 20px;
  font-size:21px;
}

.field{
  margin:14px 0;
}

.field label{
  display:block;
  font-size:12px;
  color:#687176;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  padding:11px;
  border:1px solid #dce1e2;
  border-radius:7px;
  background:#fff;
}

.field textarea{
  height:330px;
  line-height:1.8;
}

.danger{
  color:#d33;
}

</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

const KEY="my-books-v11";

const sample={
 books:[
  {
   id:"b1",
   title:"サンプル小説",
   cover:"",
   volumes:[
    {
     id:"v1",
     name:"第1巻",
     chapters:[
      {
       id:"c1",
       title:"Chapter 01",
       text:"「これはサンプルの文章です。」\nジェギョンは静かに窓の外を見た。\n「今日は寒いね。」\n「そうだな。」"
      }
     ]
    }
   ]
  },
  {
   id:"b2",
   title:"ホンブル",
   cover:"",
   volumes:[
    {
     id:"v1",
     name:"第1巻",
     chapters:[
      {
       id:"c1",
       title:"Chapter 01",
       text:"「サンプルの会話文です。」\nここから地の文が続きます。"
      }
     ]
    }
   ]
  }
 ]
};

let data;

try{
 data=JSON.parse(localStorage.getItem(KEY))||sample;
}catch(e){
 data=sample;
}

let st={
 book:null,
 vol:null,
 ch:null,
 vertical:localStorage.getItem("vertical")==="1"
};

const $=s=>document.querySelector(s);

const esc=s=>String(s??"").replace(
 /[&<>"']/g,
 m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  "\"":"&quot;",
  "'":"&#39;"
 }[m])
);

const chars=s=>[...(s||"")].filter(x=>!/\s/.test(x)).length;

const save=()=>localStorage.setItem(KEY,JSON.stringify(data));

const B=()=>data.books.find(x=>x.id===st.book);

const V=()=>B()?.volumes.find(x=>x.id===st.vol);

const C=()=>V()?.chapters.find(x=>x.id===st.ch);

const id=p=>
 p+
 Date.now().toString(36)+
 Math.random().toString(36).slice(2,6);

function bcount(b){
 return (b.volumes||[]).reduce(
  (n,v)=>n+(v.chapters||[]).reduce(
   (a,c)=>a+chars(c.text),0
  ),0
 );
}

function cover(b){

 if(b.cover){
  return `
   <div class="cover">
    <img src="${esc(b.cover)}" alt="">
   </div>
  `;
 }

 return `
  <div class="cover">
   <span>${esc(b.title)}</span>
  </div>
 `;
}

function top(title,back,right=""){

 return `
  <div class="top">
   <div class="topin">

    <button class="back"
     onclick="${back||""}">
     ${back?"‹ 戻る":""}
    </button>

    <div class="ttl">
     ${esc(title)}
    </div>

    <div class="topright">
     ${right}
    </div>

   </div>
  </div>
 `;
}

function modal(x){

 let d=document.createElement("div");

 d.id="modal";
 d.className="modalback";

 d.innerHTML=`
  <div class="modal">
   ${x}
  </div>
 `;

 d.onclick=e=>{
  if(e.target===d)closeM();
 };

 document.body.appendChild(d);
}

function closeM(){
 $("#modal")?.remove();
}

/* =====================
   本棚
===================== */

function shelf(){

 $("#app").innerHTML=`

 ${top(
  "本棚",
  "",
  "<button class='iconbtn' onclick='newBook()'>＋</button>"
 )}

 <main class="page">

  <div class="shelfHead">
   <div class="shelfTitle">
    MY BOOKS
   </div>

   <button class="addBook" onclick="newBook()">
    ＋ 本を追加
   </button>
  </div>

  <div class="filters">
   <button class="pill on">本棚</button>
   <button class="pill">未読</button>
   <button class="pill">読書中</button>
   <button class="pill">読了</button>
  </div>

  <div class="grid">

   ${data.books.map(b=>`

    <div class="book"
     onclick="detail('${b.id}')">

     ${cover(b)}

     <div class="bn">
      ${esc(b.title)}
     </div>

     <div class="meta">
      ${(b.volumes||[]).length}巻
     </div>

    </div>

   `).join("")}

  </div>

 </main>
 `;
}

/* =====================
   作品詳細
===================== */

function detail(bid){

 if(bid)st.book=bid;

 let b=B();

 if(!b)return shelf();

 $("#app").innerHTML=`

 ${top(
  b.title,
  "shelf()",
  "<button class='secondary' onclick='editBook()'>編集</button>"
 )}

 <main class="page">

  <div class="detailCard">

   <div class="detail">

    ${cover(b)}

    <div>

     <div class="dname">
      ${esc(b.title)}
     </div>

     <div class="stats">
      ${b.volumes.length}巻
      <br>
      ${bcount(b).toLocaleString()}文字
     </div>

     <div class="actions">

      <button
       class="primary"
       onclick="cont()">
       読む
      </button>

      <button
       class="secondary"
       onclick="addVol()">
       ＋ 巻
      </button>

     </div>

    </div>

   </div>

  </div>

  <div class="sectionTitle">
   巻一覧
  </div>

  ${b.volumes.map(v=>`

   <div class="vol">

    <div class="vh">

     <span>
      ${esc(v.name)}
     </span>

     <span class="vcount">
      ${v.chapters.reduce(
       (a,c)=>a+chars(c.text),0
      ).toLocaleString()}文字
     </span>

    </div>

    ${v.chapters.map((c,i)=>`

     <div class="ch"
      onclick="reader('${v.id}','${c.id}')">

      <div class="cm">

       <div class="ct">
        ${esc(
         c.title||
         "Chapter "+
         String(i+1).padStart(2,"0")
        )}
       </div>

       <div class="preview">
        ${esc(c.text.slice(0,80))}
       </div>

      </div>

      <div class="cc">
       ${chars(c.text).toLocaleString()}文字
      </div>

      <div class="chevron">
       ›
      </div>

     </div>

    `).join("")}

    <div class="ch">

     <button
      class="secondary"
      onclick="addCh('${v.id}')">
      ＋ チャプター追加
     </button>

    </div>

   </div>

  `).join("")}

 </main>
 `;
}

/* =====================
   読書
===================== */

function cont(){

 let b=B();
 let v=b?.volumes?.[0];
 let c=v?.chapters?.[0];

 if(c)reader(v.id,c.id);
}

function reader(vid,cid){

 if(vid)st.vol=vid;
 if(cid)st.ch=cid;

 let c=C();

 if(!c)return detail();

 $("#app").innerHTML=`

 <div class="reader">

  ${top(
   c.title||"Chapter",
   "detail()",
   "<button class='secondary' onclick='editCh()'>編集</button>"
  )}

  <div class="rb">

   <div
    id="txt"
    class="text ${st.vertical?"vert":""}">
    ${esc(c.text)}
   </div>

  </div>

  <div class="controls">

   <button
    class="${!st.vertical?"on":""}"
    onclick="direction(false)">
    横
   </button>

   <button
    class="${st.vertical?"on":""}"
    onclick="direction(true)">
    縦
   </button>

   <button onclick="fs(-1)">
    A−
   </button>

   <button onclick="fs(1)">
    A＋
   </button>

  </div>

 </div>
 `;
}

function direction(x){

 st.vertical=x;

 localStorage.setItem(
  "vertical",
  x?"1":"0"
 );

 reader();
}

function fs(d){

 let e=$("#txt");

 let n=
  parseFloat(
   getComputedStyle(e).fontSize
  )+d;

 e.style.fontSize=
  Math.max(
   14,
   Math.min(34,n)
  )+"px";
}

/* =====================
   巻・章
===================== */

function addVol(){

 let b=B();

 b.volumes.push({
  id:id("v"),
  name:`第${b.volumes.length+1}巻`,
  chapters:[]
 });

 save();
 detail();
}

function addCh(vid){

 let v=B().volumes.find(
  x=>x.id===vid
 );

 v.chapters.push({
  id:id("c"),
  title:
   `Chapter ${
    String(
     v.chapters.length+1
    ).padStart(2,"0")
   }`,
  text:""
 });

 save();
 detail();
}

/* =====================
   チャプター編集
===================== */

function editCh(){

 let c=C();

 modal(`

  <h2>
   チャプター編集
  </h2>

  <div class="field">

   <label>
    タイトル
   </label>

   <input
    id="ect"
    value="${esc(c.title)}">

  </div>

  <div class="field">

   <label>
    本文
    （${chars(c.text).toLocaleString()}文字）
   </label>

   <textarea id="ecx">${esc(c.text)}</textarea>

  </div>

  <div class="actions">

   <button
    class="primary"
    onclick="saveCh()">
    保存
   </button>

   <button
    class="secondary danger"
    onclick="delCh()">
    削除
   </button>

   <button
    class="secondary"
    onclick="closeM()">
    閉じる
   </button>

  </div>

 `);
}

function saveCh(){

 let c=C();

 c.title=$("#ect").value;
 c.text=$("#ecx").value;

 save();
 closeM();
 reader();
}

function delCh(){

 if(
  !confirm(
   "このチャプターを削除しますか？"
  )
 )return;

 let v=V();

 v.chapters=
  v.chapters.filter(
   x=>x.id!==st.ch
  );

 v.chapters.forEach(
  (c,i)=>
   c.title=
    `Chapter ${
     String(i+1).padStart(2,"0")
    }`
 );

 save();
 closeM();
 detail();
}

/* =====================
   作品編集
===================== */

function editBook(){

 let b=B();

 modal(`

  <h2>
   作品設定
  </h2>

  <div class="field">

   <label>
    作品タイトル
   </label>

   <input
    id="bt"
    value="${esc(b.title)}">

  </div>

  <div class="field">

   <label>
    表紙画像URL
   </label>

   <input
    id="bc"
    value="${esc(b.cover||"")}">

  </div>

  <div class="actions">

   <button
    class="primary"
    onclick="saveBook()">
    保存
   </button>

   <button
    class="secondary danger"
    onclick="delBook()">
    作品を削除
   </button>

   <button
    class="secondary"
    onclick="closeM()">
    閉じる
   </button>

  </div>

 `);
}

function saveBook(){

 let b=B();

 b.title=
  $("#bt").value.trim()||
  b.title;

 b.cover=
  $("#bc").value.trim();

 save();
 closeM();
 detail();
}

function delBook(){

 if(
  !confirm(
   "作品を削除しますか？"
  )
 )return;

 data.books=
  data.books.filter(
   x=>x.id!==st.book
  );

 save();
 closeM();
 shelf();
}

/* =====================
   新規作品
===================== */

function newBook(){

 modal(`

  <h2>
   本を追加
  </h2>

  <div class="field">

   <label>
    作品タイトル
   </label>

   <input
    id="nt"
    placeholder="作品名">

  </div>

  <div class="actions">

   <button
    class="primary"
    onclick="createBook()">
    追加
   </button>

   <button
    class="secondary"
    onclick="closeM()">
    キャンセル
   </button>

  </div>

 `);
}

function createBook(){

 let t=
  $("#nt").value.trim()||
  "新しい小説";

 data.books.push({
  id:id("b"),
  title:t,
  cover:"",
  volumes:[]
 });

 save();
 closeM();
 shelf();
}

/* 起動 */

shelf();

</script>

</body>
</html>
