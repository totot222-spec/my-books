<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d7ce0">
<link rel="manifest" href="manifest.json">
<title>My Books v1.2</title>
<style>
:root{
  --accent:#3d7ce0; --accent-dark:#2f66c2; --bg:#f5f8fc; --paper:#fdfdfb; --text:#1c2430; --muted:#8a94a3;
  --line:#e3e8f0; --card:#fff; --shadow:0 8px 24px rgba(31,60,110,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic",sans-serif}
button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh;padding-bottom:96px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{height:72px;position:relative;padding:0 16px}
.topbar-inner>.navback{position:absolute;left:16px;top:50%;transform:translateY(-50%)}
.topbar-inner>.row{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:10px;flex-wrap:nowrap}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.iconbtn.small{width:38px;height:38px;font-size:16px}
.title-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:19px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 220px)}
.navback{font-size:16px;font-weight:700;color:var(--accent);flex:0 0 auto}
.navedit{font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap;flex:0 0 auto;padding:6px 2px}

.page{max-width:1050px;margin:auto;padding:18px 18px}

/* tab bar (status filter) */
.tabbar{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}
.tab{padding:12px 1px;font-size:14.5px;color:var(--muted);font-weight:700;white-space:nowrap;position:relative}
.tab.active{color:var(--accent)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);border-radius:3px 3px 0 0}

/* cover picker */
.cover-pick{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.cover-pick .cover{width:76px;flex:0 0 auto}
.cover-pick .pickbtns{flex:1;display:flex;flex-direction:column;gap:8px}
.filehint{font-size:11.5px;color:var(--muted)}

/* section headers */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.section-head h2{font-size:18px;font-weight:800;margin:0}

/* book grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 12px}
@media(max-width:420px){.grid{gap:18px 8px}}
.book{cursor:pointer;min-width:0}
.cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#eee;box-shadow:var(--shadow);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.placeholder{background:linear-gradient(150deg,#173463,#3d7ce0 55%,#8fc1f0);color:white;padding:14px;display:flex;align-items:flex-end}
.cover.placeholder span{font-family:serif;font-size:16px;line-height:1.3;font-weight:700;white-space:pre-line}
.book-name{font-size:13.5px;font-weight:750;margin-top:8px;line-height:1.3}
.book-meta{color:var(--muted);font-size:11px;margin-top:2px}
.book-author{color:var(--muted);font-size:11.5px;margin-top:1px}
.empty{text-align:center;color:var(--muted);padding:70px 10px}

/* detail */
.detail-head{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:start}
.detail-name{font-size:24px;font-weight:850;margin:2px 0 8px;line-height:1.3}
.detail-author{color:var(--muted);font-size:14px;margin:-4px 0 8px}
.detail-stat{color:var(--muted);font-size:13.5px;line-height:1.7}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.tag{background:#eaf1fc;color:var(--accent-dark);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}

.primary{background:var(--accent);color:#fff;padding:13px 22px;border-radius:14px;font-weight:750}
.primary:active{background:var(--accent-dark)}
.secondary{background:#fff;border:1px solid var(--line);padding:11px 16px;border-radius:14px;color:var(--accent-dark);font-weight:600}
.fullbtn{width:100%;font-size:15.5px;margin-top:18px}
.section-link{font-size:13px;color:var(--accent);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* volumes */
.volumes-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.volrow{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.volgroup:last-child .volrow{border-bottom:0}
.volgroup:last-child .chapter-list:not(.hidden)~.volrow{}
.volicon{width:42px;height:54px;border-radius:8px;flex:0 0 auto;background:linear-gradient(150deg,#173463,#3d7ce0);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;text-align:center;line-height:1.2;overflow:hidden;position:relative}
.volicon img{width:100%;height:100%;object-fit:cover;display:block}
.volinfo{flex:1;min-width:0}
.volinfo b{display:block;font-size:15px;font-weight:750}
.volinfo span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.chev{color:#c6ccd6;font-size:19px;flex:0 0 auto}
.chapter-list{border-top:1px solid var(--line);background:#fafbfd}
.chapter{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);cursor:pointer}
.chapter-move{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.chapter-move button{width:26px;height:22px;font-size:10px;line-height:1;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center}
.chapter-move button:disabled{opacity:.25}
.chapter-move button:not(:disabled):active{background:#eaf1fc;color:var(--accent-dark)}
.vol-actions{display:flex;gap:6px;flex:0 0 auto}
.vol-actions button{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:10px;background:#f1f5fb;color:var(--accent-dark)}
.vol-actions button.danger{background:#fdeeee;color:#d23b3b}
.chapter-merge{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:5px;display:inline-block}
.chapter:last-child{border-bottom:0}
.chapter-main{flex:1;min-width:0}
.chapter-name{font-weight:700;font-size:14.5px}
.chapter-desc{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.chapter-count{font-size:12px;color:var(--muted);white-space:nowrap}
.addrow{padding:14px 16px}

/* synopsis */
.synopsis{color:#4a5468;line-height:1.8;font-size:14px}
.synopsis.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{color:var(--accent);font-weight:700;font-size:13px;margin-top:8px}

/* editor */
.editor{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:#666;margin-bottom:7px}
.field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:10px}
.field-head label{margin-bottom:0}
.texticons{display:flex;gap:16px;flex:0 0 auto}
.texticons button{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap;padding:2px 0}
.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;border-radius:12px;padding:11px;background:#fff}
.field textarea{min-height:200px;line-height:1.8;resize:vertical}
.fmtopts{display:flex;flex-direction:column;gap:9px;background:#fafbfd;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:#222;line-height:1.4}
.chk input{width:auto;margin-top:2px;flex:0 0 auto}
.chk-text{display:block;font-weight:700}
.chk-sub{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:2px;line-height:1.4}
.repl-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.repl-row input{flex:1}
.repl-box{background:#fafbfd;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.repl-item{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.repl-item:last-of-type{border-bottom:0}
.repl-item input{flex:1;min-width:0;border:1px solid #ddd;border-radius:9px;padding:8px 10px;background:#fff;font-size:13.5px}
.repl-arrow{flex:0 0 auto;color:var(--muted);font-size:14px}
.repl-del{flex:0 0 auto;color:#d33;font-size:16px;padding:2px 6px}
.repl-empty{font-size:12.5px;color:var(--muted);padding:4px 0 8px}
.repl-add{width:100%;margin-top:9px;font-size:13px;padding:9px}
.repl-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.repl-link{font-size:13px;font-weight:700;color:var(--accent);padding:6px 0;white-space:nowrap;background:none}
.repl-item select{flex:1;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.ab-cont{width:100%;font-size:13px}
.repl-link.muted{font-size:12px;font-weight:600;color:var(--muted)}

/* reader */
.reader{min-height:100vh;background:var(--paper);color:var(--text)}
.reader[data-theme=sepia]{--paper:#f3e9d3;--text:#3c2f20}
.reader[data-theme=dark]{--paper:#1b1e23;--text:#dfe2e7}
.reader-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:transform .25s ease}
.reader-top.reader-top-hidden{transform:translateY(-100%)}
.reader[data-theme=sepia] .reader-top{background:rgba(243,233,211,.92)}
.reader[data-theme=dark] .reader-top{background:rgba(27,30,35,.92);border-color:#333}
.reader-body{max-width:900px;margin:auto;padding:26px 24px 30px}
.reader-text{font-family:"Hiragino Mincho ProN","HiraMinProN-W3","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif KR",serif;font-size:21px;line-height:1.75;letter-spacing:.01em;white-space:pre-wrap;color:var(--text)}
.reader-text.vertical{writing-mode:vertical-rl;text-orientation:mixed;line-height:1.7;letter-spacing:.03em;overflow-x:auto;max-width:100%;height:calc(100vh - 230px);white-space:pre-wrap}
.progresswrap{max-width:520px;margin:0 auto 110px;padding:0 24px}
input[type=range].seek{width:100%;accent-color:var(--accent)}
.seek-label{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.toolbar4{position:fixed;z-index:30;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.05);border-radius:16px;padding:5px;display:flex;gap:2px;box-shadow:0 3px 12px rgba(31,60,110,.07);opacity:.62;transition:opacity .2s}
.toolbar4:hover,.toolbar4:focus-within{opacity:1}
.reader[data-theme=sepia] .toolbar4{background:rgba(243,233,211,.72);border-color:rgba(0,0,0,.06)}
.reader[data-theme=dark] .toolbar4{background:rgba(27,30,35,.72);border-color:rgba(255,255,255,.08)}
.toolbar4 button{display:flex;flex-direction:row;align-items:center;gap:5px;font-size:11.5px;color:#7a828f;padding:7px 11px;border-radius:11px;font-weight:600;white-space:nowrap;writing-mode:horizontal-tb}
.reader[data-theme=dark] .toolbar4 button{color:#9aa3b0}
.toolbar4 button .ic{font-size:14px;line-height:1}
.toolbar4 button.active{background:#eaf1fc;color:var(--accent-dark)}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:100;display:flex;align-items:flex-end}
.modal{background:#fff;width:100%;max-height:85vh;border-radius:24px 24px 0 0;padding:20px;overflow:auto}
.modal h2{margin:0 0 18px;font-size:18px}
/* 読書位置：上端の細いバー・％ボタン・ジャンプ用シート */
/* 本文の装飾 */
.reader-text .ln{min-height:1em}
.reader-text.indent .ln:not(.noind){text-indent:1em}
.ch-head{text-align:center;font-size:1.45em;font-weight:700;line-height:1.4;margin-block:1.6em 1.8em;text-indent:0}
.sysbox{margin-block:1.3em;padding:.9em 1.1em;border-radius:12px;font-size:.92em;line-height:1.7}
.sysbox .ln{text-indent:0}
.sb-gray{background:#fff;border:3px solid #a8adb4}
.sb-beige{background:#f6f2e8;border:4px solid #e7ddc4;border-radius:4px}
.sb-blue{background:#fff;border:3px solid #8fa3cb;border-radius:14px}
.reader[data-theme=sepia] .sb-gray,.reader[data-theme=sepia] .sb-blue{background:rgba(255,255,255,.45)}
.reader[data-theme=sepia] .sb-beige{background:#efe4cc;border-color:#ddcfae}
.reader[data-theme=dark] .sb-gray{background:#22262d;border-color:#5b616b}
.reader[data-theme=dark] .sb-beige{background:#2d2a24;border-color:#5a5243}
.reader[data-theme=dark] .sb-blue{background:#20252f;border-color:#4f6390}
.sb-msg{padding:1em .95em;background:#a9bfd6;border:none;border-radius:16px;font-size:.92em}
.msg-body{display:flex;flex-direction:column;align-items:flex-start;gap:.75em}
.bubble{background:#fff;border-radius:.85em;padding:.42em .95em;max-width:80%;line-height:1.55;text-indent:0;white-space:pre-wrap;color:#1c2430}
.bubble.me{align-self:flex-end;background:#fde63c}
.reader[data-theme=sepia] .sb-msg{background:#b8c3cc}
.reader[data-theme=dark] .sb-msg{background:#3a4656}
.reader[data-theme=dark] .bubble{background:#e6e9ee;color:#1c2430}
.reader[data-theme=dark] .bubble.me{background:#e8d23a}
.deco-bar .d-msg{background:#a9bfd6;color:#1f3550}
.deco-bar .d-me{background:#fde63c;color:#5a4a00}
.deco-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px}
.deco-lbl{font-size:12px;color:var(--muted);margin-right:2px}
.deco-bar button{font-size:12.5px;font-weight:600;color:var(--accent-dark);background:#f1f5fb;border-radius:9px;padding:6px 8px;border:2px solid transparent}
.deco-bar .d-gray{background:#fff;border-color:#a8adb4;color:#555}
.deco-bar .d-beige{background:#f6f2e8;border-color:#e2d6b8;color:#6b5a35}
.deco-bar .d-blue{background:#fff;border-color:#8fa3cb;color:#3d5488}
button.secondary.on{background:#eaf1fc;border-color:var(--accent);color:var(--accent-dark)}
.readbar{position:fixed;top:0;left:0;right:0;height:2px;z-index:40;background:transparent;pointer-events:none}
.readbar div{height:100%;background:rgba(110,122,140,.28);border-radius:0 2px 2px 0;transition:width .12s linear}
.reader[data-theme=sepia] .readbar div{background:rgba(120,95,60,.25)}
.reader[data-theme=dark] .readbar div{background:rgba(200,208,220,.22)}
.toolbar4 .pct-btn{color:var(--accent-dark);font-variant-numeric:tabular-nums;min-width:62px;justify-content:center}
.reader[data-theme=dark] .toolbar4 .pct-btn{color:#8fb4f0}
.modal-back.clear{background:rgba(0,0,0,.06)}
.modal-back.clear .modal{box-shadow:0 -8px 30px rgba(20,40,80,.16)}
.seek-sheet{padding:2px 2px 4px}
.seek-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted)}
.seek-where{font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seek-count{flex:0 0 auto}
.seek-big{text-align:center;font-size:52px;font-weight:800;color:var(--accent);line-height:1.1;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.seek-big small{font-size:22px;margin-left:2px;font-weight:700}
input[type=range].seek-lg{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0}
input[type=range].seek-lg::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(to right,var(--accent) 0,var(--accent) var(--p,0%),#dfe6f1 var(--p,0%),#dfe6f1 100%)}
input[type=range].seek-lg::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--accent);margin-top:-10px;box-shadow:0 2px 8px rgba(30,70,140,.28)}
input[type=range].seek-lg::-moz-range-track{height:10px;border-radius:6px;background:#dfe6f1}
input[type=range].seek-lg::-moz-range-progress{height:10px;border-radius:6px;background:var(--accent)}
input[type=range].seek-lg::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.seek-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 4px;margin-top:2px}
.seek-chips,.seek-step,.seek-chapter{display:flex;gap:7px;margin-top:14px}
.seek-chips button,.seek-step button,.seek-chapter button{flex:1;padding:10px 0;border-radius:12px;background:#eef3fb;color:var(--accent-dark);font-weight:700;font-size:13.5px}
.seek-step button{background:#f4f6fa;color:#4a5566}
.seek-chapter button{background:#fff;border:1px solid var(--line)}
.seek-chapter button:disabled{opacity:.4}
.seek-done{width:100%;margin-top:16px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);max-width:88vw;background:rgba(30,36,48,.94);color:#fff;font-size:13px;line-height:1.5;padding:10px 16px;border-radius:12px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.danger{color:#d33}
.search{width:100%;padding:12px 16px;border:1px solid #ddd;border-radius:14px;background:#fff;margin-bottom:16px}
.small{font-size:13px;color:var(--muted)}

/* bottom nav */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;z-index:50}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 14px;font-size:11px;color:#8a94a3;font-weight:600}
.navbtn .ic{font-size:21px}
.navbtn.active{color:var(--accent)}
.ic-svg{width:1em;height:1em;display:block;margin:auto}
.navbtn .ic-svg{width:.82em;height:.82em;margin:.09em auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="my-books-v1";
const defaultData={
 books:[
  {id:"book1",title:"サンプル小説",cover:"",status:"reading",
   tags:["青春","恋愛"],
   synopsis:"高校2年の夏。海の見える町で、僕たちは出会った。何気ない日々のなかで、少しずつ変わっていく気持ち。これは、あの夏を忘れないための物語。",
   volumes:[
   {id:"v1",name:"第1巻",chapters:[
    {id:"c1",title:"Chapter 01",text:"「これはサンプルの文章です。」\n\nジェギョンは静かに窓の外を見た。\n「今日は寒いね。」\n「そうだな。」"}
   ]}
  ]},
  {id:"book2",title:"ホンブル",cover:"",status:"unread",tags:[],synopsis:"",volumes:[
   {id:"v1",name:"第1巻",chapters:[
    {id:"c1",title:"Chapter 01",text:"「サンプルの会話文です。」\n\nここから地の文が続きます。"}
   ]}
  ]}
 ],
 replacements:[]
};
let data=null;
// 本のデータは容量の大きい IndexedDB に保存する（localStorage は約5MBで上限に達するため）
const IDB_NAME="my-books-db", IDB_STORE="kv";
let idbPromise=null;
function idb(){
 if(!idbPromise) idbPromise=new Promise((res,rej)=>{
  if(!("indexedDB" in window)){rej(new Error("IndexedDB unavailable"));return}
  const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);
  r.onsuccess=()=>{
   const db=r.result;
   // iOSはアプリをバックグラウンドにすると接続を切ることがある → 次回は開き直す
   db.onclose=()=>{ idbPromise=null; };
   db.onversionchange=()=>{ try{db.close()}catch(e){} idbPromise=null; };
   res(db);
  };
  r.onerror=()=>{ idbPromise=null; rej(r.error); };
  r.onblocked=()=>{ idbPromise=null; rej(new Error("blocked")); };
 });
 return idbPromise;
}

async function flushSave(){

 if(!data) return;
 if(saving){ saveAgain=true; return; }
 saving=true;
 let json=null;
 try{ data.savedAt=Date.now(); json=JSON.stringify(data); }catch(e){}
 let ok=false;
 if(json){
  for(let i=0;i<3&&!ok;i++){
   try{ await idbPut("data",json); ok=true; }
   catch(e){ idbPromise=null; await new Promise(r=>setTimeout(r,300*(i+1))); }
  }
  if(ok){ try{ localStorage.removeItem(KEY); }catch(e){} }
  else { try{ localStorage.setItem(KEY,json); ok=true; }catch(e){} }
 }
 saving=false;
 if(ok){ saveFailed=false; }
 else {
  saveFailed=true; // 画面に戻ってきたときに自動でもう一度保存する
  if(!document.hidden) toast("保存できませんでした。自動で再試行します。続く場合は 設定→データを書き出す でバックアップを");
 }
 if(saveAgain){ saveAgain=false; flushSave(); }
}

/* ---- translation cleanup tools ---- */
function normalizeBlankLines(text){
 return text.replace(/\n{3,}/g,"\n\n");
}
function fixDuplicateBrackets(text){
 let out=text;
 const collapse=(re,rep)=>{ let prev; do{ prev=out; out=out.replace(re,rep); }while(out!==prev); };
 collapse(/「[ \t　]*「/g,"「");
 collapse(/」[ \t　]*」/g,"」");
 collapse(/『[ \t　]*『/g,"『");
 collapse(/』[ \t　]*』/g,"』");
 out=out.replace(/["“]{2,}/g,"「").replace(/["”]{2,}/g,"」");
 return out;
}
function normalizeEllipsis(text){
 return text.replace(/\.{4,}/g,"……").replace(/。{4,}/g,"……").replace(/…{3,}/g,"……");
}
function findBracketIssuesFor(text,openCh,closeCh,label){
 let lines=text.split("\n"); let balance=0; let issues=[];
 lines.forEach((line,idx)=>{
  for(const ch of line){
   if(ch===openCh) balance++;
   else if(ch===closeCh){
    balance--;
    if(balance<0){ issues.push(`${idx+1}行目: 対応する${openCh}のない${closeCh}があります`); balance=0; }
   }
  }
 });
 if(balance>0) issues.push(`${label}が${balance}個閉じられていません（${closeCh}が見つかりません）`);
 return issues;
}
function findBracketIssues(text){
 return [...findBracketIssuesFor(text,"「","」","「"),...findBracketIssuesFor(text,"『","』","『")];
}

function joinBrokenLines(text){
 // 行末が句点などの文末記号で終わっていない行は、OCRの改行ズレとみなして次の行と結合する
 const enders=["。","！","？","」","…","』","”"];
 let lines=text.split("\n");
 let out=[]; let buffer=null; let inBox=false;
 lines.forEach(raw=>{
  let line=raw;
  if(line.trim()===""){ if(buffer!==null){out.push(buffer);buffer=null;} out.push(""); return; }
  if(/^:::/.test(line.trim())){ if(buffer!==null){out.push(buffer);buffer=null;} inBox=!inBox; out.push(line.trim()); return; }
  if(inBox){ out.push(line); return; } // 枠の中の行はつなげない
  if(line.trim()==="***"||isMarkupLine(line)){ if(buffer!==null){out.push(buffer);buffer=null;} out.push(line.trim()); return; }
  let trimmedEnd=line.replace(/[\s　]+$/,"");
  buffer = buffer===null ? trimmedEnd : buffer+trimmedEnd;
  let lastChar=buffer.slice(-1);
  if(enders.includes(lastChar)){ out.push(buffer); buffer=null; }
 });
 if(buffer!==null) out.push(buffer);
 return out.join("\n");
}
function insertDialogueBreaksBefore(text){
 // 文末記号（。！？…」』）の直後にある「または-は、会話の始まりとみなして直前に改行する。
 // 文の途中（助詞などの後）にある「はそのまま＝説明・強調の「」として扱い、改行しない。
 const sentenceEnd=["。","！","？","…","」","』"];
 const openers=["「","-"];
 let result="";
 for(let i=0;i<text.length;i++){
  let ch=text[i];
  if(openers.includes(ch)){
   let prev=result.length?result[result.length-1]:"\n";
   let atLineStart=prev==="\n";
   let afterSentenceEnd=sentenceEnd.includes(prev);
   if(!atLineStart && afterSentenceEnd) result+="\n";
  }
  result+=ch;
 }
 return result;
}
function insertDialogueBreaks(text){
 // 「」の直後が助詞・読点などの続き言葉でなければ、会話文の終わりとみなして改行する
 const continuations=["と","という","っていう","とか","も","は","が","を","に","で","や","の","から","まで","ば","たら","なら","って","、","）",")","」","』"];
 let result="";
 for(let i=0;i<text.length;i++){
  let ch=text[i];
  result+=ch;
  if(ch==="」"){
   let next=text[i+1];
   if(next===undefined||next==="\n") continue;
   let rest=text.slice(i+1);
   let isContinuation=continuations.some(c=>rest.startsWith(c));
   if(!isContinuation) result+="\n";
  }
 }
 return result;
}
function addSceneBreakSpacing(text){
 let lines=text.split("\n"); let out=[];
 for(let i=0;i<lines.length;i++){
  let line=lines[i];
  if(line.trim()==="***"){
   while(out.length&&out[out.length-1].trim()==="") out.pop();
   if(out.length) out.push("");
   out.push("***");
   let j=i+1; while(j<lines.length&&lines[j].trim()==="") j++;
   out.push(""); i=j-1;
  } else out.push(line);
 }
 while(out.length&&out[0].trim()==="") out.shift();
 while(out.length&&out[out.length-1].trim()==="") out.pop();
 return out.join("\n");
}

function adjustDialogueSpacing(delta){
 const ta=document.getElementById("ec-text");
 if(!ta) return;
 let lines=ta.value.split("\n");
 let out=[]; let i=0;
 const isDialogueLine=s=>/^[「『]/.test(s.trim());
 while(i<lines.length){
  let line=lines[i];
  if(isDialogueLine(line)){
   let blankBefore=0;
   while(out.length && out[out.length-1].trim()==="") { out.pop(); blankBefore++; }
   let newBefore=Math.max(0,blankBefore+delta);
   if(out.length){ for(let k=0;k<newBefore;k++) out.push(""); }
   out.push(line);
   let j=i+1,blankAfter=0;
   while(j<lines.length && lines[j].trim()===""){ blankAfter++; j++; }
   let hasNext=j<lines.length;
   let newAfter=Math.max(0,blankAfter+delta);
   if(hasNext){ for(let k=0;k<newAfter;k++) out.push(""); }
   i=j;
  } else { out.push(line); i++; }
 }
 ta.value=out.join("\n");
 const lbl=document.getElementById("ec-count");
 if(lbl) lbl.textContent=count(ta.value).toLocaleString()+"文字";
}

//   # 見出し          → 中央寄せの大きな見出し
//   ::: グレー / ベージュ / ブルー  …  :::   → 枠で囲む
const BOX_STYLES={"グレー":"gray","gray":"gray","灰":"gray","ベージュ":"beige","beige":"beige","ブルー":"blue","blue":"blue","青":"blue","メッセージ":"msg","message":"msg","チャット":"msg"};
const BOX_NAMES={gray:"グレー",beige:"ベージュ",blue:"ブルー",msg:"メッセージ"};
function isMarkupLine(line){ const t=line.trim(); return /^:::/.test(t)||/^#\s/.test(t); }
function lineHTML(line,inBox){
 if(line.trim()==="") return '<div class="ln">\u200b</div>';
 const noind=inBox||/^[\s　]*[「『（(【\[<＜〈《\-－―—・※*＊]/.test(line);
 return `<div class="ln${noind?' noind':''}">${esc(line.replace(/^[ 　]+/,""))}</div>`;
}
function renderBodyHTML(text){
 const lines=String(text||"").split("\n");
 let html="", box=null, boxLines=[];
 const closeBox=()=>{
  if(box==="msg"){
   // メッセージ画面：1行＝吹き出し1つ（空行は詰める）
   // 「> 」で始まる行＝自分のメッセージ（右・黄色）、それ以外＝相手（左・白）
   const bubbles=boxLines.filter(l=>l.trim()!=="").map(l=>{
    const t=l.trim(), me=/^[>＞]/.test(t);
    return `<div class="bubble${me?" me":""}">${esc(me?t.replace(/^[>＞][ 　]*/,""):t)}</div>`;
   }).join("");
   html+=`<div class="sysbox sb-msg"><div class="msg-body">${bubbles}</div></div>`;
  } else {
   html+=`<div class="sysbox sb-${box}">${boxLines.map(l=>lineHTML(l,true)).join("")}</div>`;
  }
  box=null; boxLines=[];
 };
 for(const line of lines){
  const t=line.trim();
  const m=/^:::\s*(.*)$/.exec(t);
  if(m){
   if(box){ closeBox(); }
   else { box=BOX_STYLES[m[1].trim()]||"gray"; }
   continue;
  }
  if(box){ boxLines.push(line); continue; }
  const h=/^#\s+(.*)$/.exec(t);
  if(h){ html+=`<div class="ch-head">${esc(h[1])}</div>`; continue; }
  html+=lineHTML(line,false);
 }
 if(box) closeBox(); // 閉じ忘れは最後まで枠にする
 return html;
}

const BOXAUTO_PRESET={
 rules:[{key:"<シナリオノート",style:"beige"},{key:"[情報を閲覧",style:"blue"},{key:"ランク",style:"blue"}],
 gray:true,
 cont:"ランク,役柄,役名,脚本,台本,台詞,特殊能力,主な登場人物,主要登場人物,登場人物,シナリオクリア条件,クリア条件,テイク"
};

const OPEN_CLS={"[":"[","［":"[","<":"<","＜":"<","〈":"<","【":"【"};
const CLOSE_OF={"[":/[\]］]/,"<":/[>＞〉]/,"【":/】/};
function bracketDepthDelta(str){
 let d=0;
 for(const ch of str){
  if("[［<＜〈【「『（(".includes(ch)) d++;
  else if("]］>＞〉】」』）)".includes(ch)) d--;
 }
 return d;
}
function escRe(x){ return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function contKeys(cfg){ return (cfg.cont||"").split(/[,、，\s]+/).map(x=>x.trim()).filter(Boolean); }
function ruleMatches(rule,t){
 const k=rule.key.trim(); if(!k) return false;
 const kc=OPEN_CLS[k[0]];
 if(kc){ // 「[情報を閲覧」のように括弧で始まるキー → 行頭の括弧の中にその文字があれば一致
  if(OPEN_CLS[t[0]]!==kc) return false;
  const m=CLOSE_OF[kc].exec(t); const inner=m?t.slice(1,m.index):t.slice(1);
  return inner.includes(k.slice(1));
 }
 return t.startsWith(k);
}
function boxTrigger(t,cfg){
 for(const r of cfg.rules){ if(ruleMatches(r,t)) return {style:r.style,header:!!OPEN_CLS[r.key.trim()[0]],rule:true}; }
 if(cfg.gray && /^[\[［!！]/.test(t)) return {style:"gray",header:true,rule:false};

function isBoxContLine(t,cfg){
 if(/^[\[［<＜〈【\-－・!！]/.test(t)) return true;
 return contKeys(cfg).some(k=>t.startsWith(k));
}
function tidyBoxLines(lines,cfg){
 // 1) 括弧が閉じていない行は次の行とつなげる（OCRの途中改行）
 const merged=[]; let depth=0;
 for(const raw of lines){
  const t=raw.trim(); if(!t) continue;
  if(merged.length && depth>0 && !isBoxContLine(t,cfg)) merged[merged.length-1]+=t;
  else merged.push(t);
  depth=Math.max(0,bracketDepthDelta(merged[merged.length-1]));
 }
 // 2) つながってしまった項目を分ける
 const keys=contKeys(cfg).map(escRe).join("|");
 const out=[];
 for(let s of merged){
  s=s.replace(/([\]］])[ 　]*(?=[<＜〈])/g,"$1\n");                         // ]<… → 改行
  s=s.replace(/([>＞〉\]］。？?！!）)」])[ 　]*(?=[-－][ 　])/g,(m,ch,off)=>off<8?m:ch+"\n"); // 。- … → 改行（「！注意！ - 」のような短い頭は分けない）
  if(keys){
   s=s.replace(new RegExp("(\\S)[ 　]*(?=[-－][ 　]*(?:"+keys+"))","g"),"$1\n");          // …卿- シナリオクリア条件
   s=s.replace(new RegExp("([^\\s\\-－])[ 　]*(?=(?:"+keys+")[ 　]*[-－ー―—:：])","g"),"$1\n"); // …号脚本－ → 改行
  }
  s.split("\n").map(x=>x.trim()).filter(Boolean).forEach(x=>out.push(x));
 }
 return out;
}
function autoBoxText(text,cfg,tidy){
 const lines=String(text||"").split("\n");
 const out=[]; let inExisting=false, made=0;
 for(let i=0;i<lines.length;i++){
  const line=lines[i], t=line.trim();
  if(/^:::/.test(t)){ inExisting=!inExisting; out.push(line); continue; }  // すでに付いている枠はそのまま
  if(inExisting||!t){ out.push(line); continue; }
  const trig=boxTrigger(t,cfg);
  if(!trig){ out.push(line); continue; }
  const box=[line]; let depth=Math.max(0,bracketDepthDelta(t)); let j=i+1;
  while(j<lines.length){
   const lt=lines[j].trim();
   if(!lt||/^:::/.test(lt)) break;
   let take=false;
   if(depth>0) take=true;
   else {
    const tg=boxTrigger(lt,cfg);
    if(tg&&tg.rule&&(tg.header||tg.style!==trig.style)) take=false;
    else if(tg&&!tg.rule&&/^[!！]/.test(lt)&&trig.style!=="gray") take=false;
    else if(tg) take=true;
    else if(isBoxContLine(lt,cfg)) take=true;
    else { const nx=(lines[j+1]||"").trim(); take=/^[\-－・]/.test(nx)&&lt.length<160; } // 項目の途中で改行された行
    if(!take) break;
   }
   box.push(lines[j]); depth=Math.max(0,depth+bracketDepthDelta(lt)); j++;
  }
  const body=tidy?tidyBoxLines(box,cfg):box.map(x=>x.trim()).filter(Boolean);
  out.push("::: "+BOX_NAMES[trig.style], ...body, ":::"); made++;
  i=j-1;
 }
 return {text:out.join("\n"),made};
}

function updateEditorCount(){ const ta=document.getElementById("ec-text"), l=document.getElementById("ec-count"); if(ta&&l) l.textContent=count(ta.value).toLocaleString()+"文字"; }
function decorate(kind){
 const ta=document.getElementById("ec-text"); if(!ta) return;
 const v=ta.value; let s=ta.selectionStart, e=ta.selectionEnd;
 if(e>s && v[e-1]==="\n") e--;               // 行末の改行まで選んでいても次の行は含めない
 const ls=v.lastIndexOf("\n",s-1)+1;
 let le=v.indexOf("\n",e); if(le<0) le=v.length;
 const block=v.slice(ls,le);
 let out;
 if(kind==="head"){
  out=block.split("\n").map(l=>l.trim()===""?l:"# "+l.replace(/^#\s*/,"").trim()).join("\n");
 } else {
  out=`::: ${BOX_NAMES[kind]}\n${block}\n:::`;
 }
 ta.value=v.slice(0,ls)+out+v.slice(le);
 ta.focus(); try{ ta.setSelectionRange(ls,ls+out.length); }catch(err){}
 updateEditorCount();
}
function toggleMe(){
 // 選んだ行を「自分のメッセージ（右側）」にする／戻す
 const ta=document.getElementById("ec-text"); if(!ta) return;
 const v=ta.value; let s=ta.selectionStart, e=ta.selectionEnd;
 if(e>s && v[e-1]==="\n") e--;
 const ls=v.lastIndexOf("\n",s-1)+1; let le=v.indexOf("\n",e); if(le<0) le=v.length;
 const lines=v.slice(ls,le).split("\n");
 const target=lines.filter(l=>l.trim()&&!/^:::/.test(l.trim()));
 if(!target.length) return;
 const allMe=target.every(l=>/^[>＞]/.test(l.trim()));
 const out=lines.map(l=>{ const t=l.trim(); if(!t||/^:::/.test(t)) return l; return allMe?t.replace(/^[>＞][ 　]*/,""):(/^[>＞]/.test(t)?t:"> "+t); }).join("\n");
 ta.value=v.slice(0,ls)+out+v.slice(le);
 ta.focus(); try{ ta.setSelectionRange(ls,ls+out.length); }catch(err){}
 updateEditorCount();
}
function undecorate(){
 const ta=document.getElementById("ec-text"); if(!ta) return;
 const lines=ta.value.split("\n");
 const curLine=ta.value.slice(0,ta.selectionStart).split("\n").length-1;
 // 見出し行ならその記号だけ外す
 if(/^#\s/.test(lines[curLine].trim())){
  lines[curLine]=lines[curLine].replace(/^(\s*)#\s+/,"$1");
  ta.value=lines.join("\n"); updateEditorCount(); return;
 }
 // カーソルを含む枠を探す（開始記号と終了記号の組）
 let open=-1, inBox=false, start=-1;
 for(let i=0;i<lines.length;i++){
  if(/^:::/.test(lines[i].trim())){
   if(!inBox){ inBox=true; start=i; }
   else {
    inBox=false;
    if(curLine>=start && curLine<=i){ open=start; lines.splice(i,1); lines.splice(start,1); break; }
   }
  }
 }
 if(open<0 && inBox && curLine>=start){ open=start; lines.splice(start,1); } // 閉じ忘れの枠
 if(open<0){ alert("外したい枠や見出しの中にカーソルを置いてから押してください"); return; }
 ta.value=lines.join("\n");
 const pos=lines.slice(0,open).join("\n").length+(open?1:0);
 ta.focus(); try{ ta.setSelectionRange(pos,pos); }catch(err){}
 updateEditorCount();
}

function resizeImageFile(file,maxDim,cb){
 // Use an object URL (not FileReader/dataURL) to avoid holding a huge base64
 // string in memory alongside the decoded bitmap — large camera photos can
 // otherwise push mobile Safari over its memory limit and force a page reload.
 const url=URL.createObjectURL(file);
 const img=new Image();
 // NOTE: never reassign img.src to "" here — on some browsers that itself
 // fires a bogus error event, re-entering onerror and looping the alert().
 const cleanup=()=>{ URL.revokeObjectURL(url); img.onload=null; img.onerror=null; };
 img.onload=()=>{
  try{
   let w=img.width,h=img.height;
   if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim} } else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim} }
   const canvas=document.createElement("canvas");
   canvas.width=w;canvas.height=h;
   canvas.getContext("2d").drawImage(img,0,0,w,h);
   const dataUrl=canvas.toDataURL("image/jpeg",0.82);
   canvas.width=0;canvas.height=0;
   cleanup();
   cb(dataUrl);
  }catch(e){ cleanup(); alert("画像の処理に失敗しました"); }
 };
 img.onerror=()=>{ cleanup(); alert("画像を読み込めませんでした"); };
 img.src=url;
}

  };
  r.onerror=()=>{
   texts[i]={name:f.name,body:""};
   if(++done===files.length) finishFileImport(vid,texts);
  };
  r.readAsText(f,"utf-8");
 });
}
function finishFileImport(vid,texts){
 const joined=texts.map(t=>t.body).join("\n");
 modal(`<h2>ファイルから読み込み</h2>
 <div class="small" style="margin-bottom:12px">${texts.length}個のファイルを読み込みました（ファイル名順）。</div>
 <div class="field"><label>取り込み方法</label>
  <div class="fmtopts">
   <label class="chk"><input type="radio" name="fi-mode" value="perfile" ${texts.length>1?"checked":""}> ファイル1つ＝1チャプター（ファイル名をタイトルに）</label>
   <label class="chk"><input type="radio" name="fi-mode" value="marker" ${texts.length>1?"":"checked"}> 全部つなげて、区切り文字で分割する</label>
  </div>
 </div>
 <div class="field"><label>章の区切り文字（上の「区切り文字で分割」を選んだ場合）</label><input id="fi-marker" placeholder="例: 제1장"></div>
 <div class="field"><label>プレビュー（先頭200文字）</label><textarea readonly style="min-height:110px">${esc(joined.slice(0,200))}</textarea></div>
 <div class="actions"><button class="primary" onclick='runFileImport("${vid}")'>インポート</button><button class="secondary" onclick="closeModal()">キャンセル</button></div>`);
 window.__pendingFiles=texts;
}
function runFileImport(vid){
 const texts=window.__pendingFiles||[];
 if(!texts.length){closeModal();return}
 const mode=document.querySelector('input[name="fi-mode"]:checked')?.value||"perfile";
 const marker=document.getElementById("fi-marker").value.trim();
 let v=book().volumes.find(x=>x.id===vid);
 if(!v){closeModal();return}
 if(mode==="perfile"){
  texts.forEach(t=>{
   v.chapters.push({id:uid("c"),title:t.name||`Chapter ${String(v.chapters.length+1).padStart(2,"0")}`,text:t.body.trim()});
  });
 } else {
  const all=texts.map(t=>t.body).join("\n");
  let chunks=[];
  if(marker){
   let cur=null;
   all.split("\n").forEach(line=>{
    if(line.trim().startsWith(marker)){
     if(cur) chunks.push(cur);
     cur={title:line.trim(),body:[]};
    } else {
     if(!cur) cur={title:"",body:[]};
     cur.body.push(line);
    }
   });
   if(cur) chunks.push(cur);
  } else chunks=[{title:"",body:all.split("\n")}];
  chunks.forEach(ch=>{
   v.chapters.push({id:uid("c"),title:ch.title||`Chapter ${String(v.chapters.length+1).padStart(2,"0")}`,text:ch.body.join("\n").trim()});
  });
 }
 window.__pendingFiles=null;
 try{save()}catch(e){alert("保存できませんでした。容量が上限に達した可能性があります。")}
 closeModal();renderDetail();
}
function bulkImport(vid){
 modal(`<h2>一括インポート</h2>
 <div class="field"><label>章の区切り文字（任意）</label><input id="bi-marker" placeholder="例: 제1장 　※この文字で始まる行で章を分割します"></div>
 <div class="field"><label>OCRテキストを貼り付け</label>
  <div class="row" style="margin-bottom:8px"><button class="secondary" onclick="pasteClipboard('bi-text')">クリップボードから貼り付け</button></div>
  <textarea id="bi-text" placeholder="複数スクショ分のOCRテキストをまとめてここに貼り付けできます"></textarea>
 </div>
 <div class="small" style="margin-bottom:12px">区切り文字を空欄にすると、貼り付けた内容全体を1つの新しいチャプターとして追加します。</div>
 <div class="actions"><button class="primary" onclick="runBulkImport('${vid}')">インポート</button><button class="secondary" onclick="closeModal()">キャンセル</button></div>`)
}
function runBulkImport(vid){
 const text=document.getElementById("bi-text").value;
 const marker=document.getElementById("bi-marker").value.trim();
 if(!text.trim()){alert("テキストが空です");return}
 let v=book().volumes.find(x=>x.id===vid);
 let chunks=[];
 if(marker){
  let lines=text.split("\n");
  let cur=null;
  lines.forEach(line=>{
   if(line.trim().startsWith(marker)){
    if(cur) chunks.push(cur);
    cur={title:line.trim(),body:[]};
   } else {
    if(!cur) cur={title:"",body:[]};
    cur.body.push(line);
   }
  });
  if(cur) chunks.push(cur);
 } else {
  chunks=[{title:"",body:text.split("\n")}];
 }
 chunks.forEach(ch=>{
  v.chapters.push({id:uid("c"),title:ch.title||`Chapter ${String(v.chapters.length+1).padStart(2,"0")}`,text:ch.body.join("\n").trim()});
 });
 save();closeModal();renderDetail();
}
function editBook(){
 let b=book();
 modal(`<h2>作品編集</h2>
 <div class="field"><label>作品タイトル</label><input id="eb-title" value="${esc(b.title)}"></div>
 <div class="field"><label>作者</label><input id="eb-author" value="${esc(b.author)}" placeholder="作者名"></div>
 <div class="field"><label>表紙画像</label>
  <div class="cover-pick">

   <div class="pickbtns">
    <input type="file" accept="image/*" id="eb-cover-file" class="hidden" onchange="handleCoverFile(this,'eb')">

   </div>
  </div>

 </div>
 <div class="field"><label>ジャンルタグ（カンマ区切り）</label><input id="eb-tags" value="${esc(b.tags.join(", "))}" placeholder="青春, 恋愛, 現代"></div>

}
function saveBookEdit(){
 let b=book();
 b.title=document.getElementById("eb-title").value.trim()||b.title;
 b.author=document.getElementById("eb-author").value.trim();
 b.cover=document.getElementById("eb-cover").value.trim();

 b.synopsis=document.getElementById("eb-synopsis").value;
 save();closeModal();renderDetail();
}
function deleteBook(){if(!confirm("作品を削除しますか？"))return;data.books=data.books.filter(b=>b.id!==state.bookId);save();closeModal();renderShelf()}
function newBook(){modal(`<h2>本を追加</h2>
 <div class="field"><label>作品タイトル</label><input id="nb-title" placeholder="作品名"></div>
 <div class="field"><label>作者（任意）</label><input id="nb-author" placeholder="作者名"></div>
 <div class="field"><label>表紙画像（任意）</label>
  <div class="cover-pick">
   <div id="nb-cover-preview">${coverHTML({cover:"",title:"表紙"})}</div>
   <div class="pickbtns">
    <input type="file" accept="image/*" id="nb-cover-file" class="hidden" onchange="handleCoverFile(this,'nb')">
    <button class="secondary" onclick="document.getElementById('nb-cover-file').click()">写真から選択</button>
    <div class="filehint">画像は自動的に縮小して保存されます</div>
   </div>
  </div>
  <input type="hidden" id="nb-cover" value="">
 </div>
 <button class="primary" onclick="createBook()">追加</button> <button class="secondary" onclick="closeModal()">キャンセル</button>`)}
function createBook(){let title=document.getElementById("nb-title").value.trim()||"新しい小説";data.books.push({id:uid("b"),title,author:document.getElementById("nb-author").value.trim(),cover:document.getElementById("nb-cover").value.trim(),status:"unread",tags:[],synopsis:"",replacements:[],volumes:[]});save();closeModal();renderShelf()}
function openSettings(){modal(`<h2>設定</h2><div class="field"><label>読書表示</label><div class="small">リーダーでは横書き・縦書き、文字サイズ、背景テーマを切り替えられます。</div></div><div class="field"><label>データ</label><div class="filehint" id="storageInfo" style="margin-bottom:10px">使用容量を確認中…</div><button class="secondary" onclick="exportData()">データを書き出す</button> <button class="secondary" onclick="importData()">データを読み込む</button></div><button class="secondary" onclick="closeModal()">閉じる</button>`);showStorageInfo()}
async function showStorageInfo(){
 const el=document.getElementById("storageInfo"); if(!el) return;
 const mb=n=>n<1024*1024?Math.max(1,Math.round(n/1024))+"KB":(n/1024/1024).toFixed(1)+"MB";
 let dataSize=0; try{ dataSize=new Blob([JSON.stringify(data)]).size; }catch(e){}
 let line=`本のデータ：約${mb(dataSize)}`;
 try{
  if(navigator.storage&&navigator.storage.estimate){
   const est=await navigator.storage.estimate();
   if(est.quota) line+=` ／ このアプリが使える上限：約${est.quota>1024*1024*1024?(est.quota/1024/1024/1024).toFixed(1)+"GB":mb(est.quota)}`;
  }
  if(navigator.storage&&navigator.storage.persisted){ line+=(await navigator.storage.persisted())?"（自動削除から保護中）":""; }
 }catch(e){}
 el.textContent=line;
}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="my-books-backup.json";a.click()}
function importData(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=normalizeData(JSON.parse(r.result));save();closeModal();renderShelf()}catch(e){alert("読み込みに失敗しました")}};r.readAsText(f)};i.click()}
function modal(html){let d=document.createElement("div");d.id="modal";d.className="modal-back";d.innerHTML=`<div class="modal">${html}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d)}
function closeModal(){document.getElementById("modal")?.remove()}
window.addEventListener("scroll",()=>{
 if(!document.querySelector(".reader-body")) return;
 state.readerScrollRatio=currentReaderRatio();
 recordProgress(state.readerScrollRatio);
 updatePercentUI(state.readerScrollRatio);

 const topEl=document.getElementById("readerTop");
 if(topEl){
  const cur=window.scrollY;
  const delta=cur-lastScrollY;
  if(cur<=8){
   topEl.classList.remove("reader-top-hidden");
  } else if(delta>4){
   topEl.classList.add("reader-top-hidden");
  } else if(delta<-4){
   topEl.classList.remove("reader-top-hidden");
  }
  lastScrollY=cur;
 }
},{passive:true});
function flushAllNow(){
 if(!data) return;
 clearTimeout(progressSaveTimer); progressSaveTimer=null;
 writeProgressNow();
 if(saveTimer) flushSave();
}
document.addEventListener("visibilitychange",()=>{
 if(document.hidden) flushAllNow();
 else if(saveFailed) flushSave(); // 戻ってきたら失敗分を再保存
});
window.addEventListener("pagehide",flushAllNow);
initApp();
if("serviceWorker"in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
