<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>My Books v1.3</title>
<style>
:root{--accent:#1686e8;--bg:#f7fbfe;--paper:#fffefa;--text:#202124;--muted:#818994;--line:#e2eaf0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,textarea{font:inherit}button{border:0;background:none;color:inherit}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.topin{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.ttl{font-size:23px;font-weight:800}.back{font-size:17px;color:var(--accent);font-weight:700}
.round{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 5px 18px #00000012;font-size:25px}
.page{max-width:960px;margin:auto;padding:20px 18px 100px}.filters{display:flex;gap:9px;overflow:auto;margin-bottom:20px}.pill{border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 18px;white-space:nowrap}.pill.on{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 14px}@media(min-width:760px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.cover{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:linear-gradient(145deg,#8fd3f4,#dff4ff 55%,#83badc);box-shadow:0 7px 20px #0002;display:flex;align-items:flex-end}
.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover span{padding:13px;color:#fff;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:700;font-size:18px;white-space:pre-line;text-shadow:0 2px 8px #0005}
.bn{font-weight:750;font-size:15px;margin-top:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:13px;color:var(--muted);margin-top:4px}.book{cursor:pointer}
.detail{display:grid;grid-template-columns:135px 1fr;gap:18px}.dname{font-size:27px;font-weight:850;margin:2px 0 9px}.stats{color:var(--muted);line-height:1.8}
.primary,.secondary{padding:12px 17px;border-radius:13px;font-weight:700}.primary{background:var(--accent);color:white}.secondary{background:white;border:1px solid #ddd}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
h2{margin-top:28px}.vol{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin:12px 0}.vh{padding:16px 17px;font-size:19px;font-weight:800;display:flex;justify-content:space-between}.ch{padding:15px 17px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}.cm{flex:1;min-width:0}.ct{font-weight:700}.preview{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.cc{font-size:12px;color:#888;white-space:nowrap}
.reader{min-height:100vh;background:var(--paper)}.reader .top{background:rgba(255,253,248,.96)}.rb{max-width:900px;margin:auto;padding:26px 27px 150px}.text{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:22px;line-height:2.05;letter-spacing:.02em;white-space:pre-wrap}.text.vert{writing-mode:vertical-rl;text-orientation:mixed;height:calc(100vh - 220px);overflow-x:auto;line-height:1.9}
.controls{position:fixed;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:5px;padding:7px;background:#fffc;border:1px solid #ddd;border-radius:18px;backdrop-filter:blur(12px);white-space:nowrap}.controls button{padding:9px 11px;border-radius:11px}.controls .on{background:#eee}
.modalback{position:fixed;inset:0;background:#0006;z-index:100;display:flex;align-items:flex-end}.modal{width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px}.field{margin:13px 0}.field label{display:block;font-size:13px;color:#666;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px}.field textarea{height:330px;line-height:1.8}.danger{color:#d33}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;margin-bottom:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const KEY="my-books-data-v1";
const sample={books:[
{id:"b1",title:"サンプル小説",cover:"",volumes:[{id:"v1",name:"第1巻",chapters:[{id:"c1",title:"Chapter 01",text:"「これはサンプルの文章です。」\nジェギョンは静かに窓の外を見た。\n「今日は寒いね。」\n「そうだな。」"}]}]},
{id:"b2",title:"ホンブル",cover:"",volumes:[{id:"v1",name:"第1巻",chapters:[{id:"c1",title:"Chapter 01",text:"「サンプルの会話文です。」\nここから地の文が続きます。"}]}]}
]};

function normalizeBook(b,i){
  const oldCount=Number(b?.volumes)||0;
  const vols=Array.isArray(b?.volumes)
    ? b.volumes.map((v,j)=>({
        id:v?.id||("v"+Date.now()+i+j),
        name:v?.name||`第${j+1}巻`,
        chapters:Array.isArray(v?.chapters)?v.chapters.map((c,k)=>({
          id:c?.id||("c"+Date.now()+i+j+k),
          title:c?.title||`Chapter ${String(k+1).padStart(2,"0")}`,
          text:typeof c?.text==="string"?c.text:""
        })):[]
      }))
    : Array.from({length:oldCount},(_,j)=>({
        id:"v"+Date.now()+i+j,
        name:`第${j+1}巻`,
        chapters:[]
      }));
  return {id:b?.id||("b"+Date.now()+i),title:b?.title||`作品${i+1}`,cover:b?.cover||"",volumes:vols};
}

function loadData(){
  const keys=[KEY,"my-books-v11","my-books-v1"];
  for(const key of keys){
    try{
      const raw=localStorage.getItem(key);
      if(!raw) continue;
      const parsed=JSON.parse(raw);
      const books=Array.isArray(parsed)?parsed:(Array.isArray(parsed?.books)?parsed.books:null);
      if(books){
        const normalized={books:books.map(normalizeBook)};
        localStorage.setItem(KEY,JSON.stringify(normalized));
        return normalized;
      }
    }catch(e){}
  }
  const fresh={books:sample.books.map(normalizeBook)};
  localStorage.setItem(KEY,JSON.stringify(fresh));
  return fresh;
}

let data=loadData();
let st={book:null,vol:null,ch:null,vertical:localStorage.getItem("vertical")==="1"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const chars=s=>[...(s||"")].filter(x=>!/\s/.test(x)).length;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const B=()=>data.books.find(x=>x.id===st.book);
const V=()=>B()?.volumes.find(x=>x.id===st.vol);
const C=()=>V()?.chapters.find(x=>x.id===st.ch);
const id=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function bcount(b){return (b.volumes||[]).reduce((n,v)=>n+(v.chapters||[]).reduce((a,c)=>a+chars(c.text),0),0)}
function cover(b){return b.cover?`<div class="cover"><img src="${esc(b.cover)}" alt=""></div>`:`<div class="cover"><span>${esc(b.title)}</span></div>`}
function top(title,back,right=""){return `<div class="top"><div class="topin"><button class="back" onclick="${back||""}">${back?"‹ 戻る":""}</button><div class="ttl">${esc(title)}</div><div>${right}</div></div></div>`}
function modal(x){let d=document.createElement("div");d.id="modal";d.className="modalback";d.innerHTML=`<div class="modal">${x}</div>`;d.onclick=e=>{if(e.target===d)closeM()};document.body.appendChild(d)}
function closeM(){$("#modal")?.remove()}

function searchBooks(){modal(`<h2>本を検索</h2><input id="bookSearch" class="search" placeholder="作品タイトル" oninput="runBookSearch()"><div id="searchResults"></div><div class="actions"><button class="secondary" onclick="closeM()">閉じる</button></div>`);runBookSearch()}
function runBookSearch(){const q=$("#bookSearch")?.value.trim().toLowerCase()||"";const results=data.books.filter(b=>!q||b.title.toLowerCase().includes(q));$("#searchResults").innerHTML=results.map(b=>`<button style="display:block;width:100%;text-align:left;padding:15px 5px;border-bottom:1px solid #eee" onclick="closeM();detail('${b.id}')"><b>${esc(b.title)}</b><div class="meta">${(b.volumes||[]).length}巻 ・ ${bcount(b).toLocaleString()}文字</div></button>`).join("")}
function shelf(){
 st.book=null;st.vol=null;st.ch=null;
 $("#app").innerHTML=`${top("本棚","","<span style='display:flex;gap:8px'><button class='round' onclick='searchBooks()'>⌕</button><button class='round' onclick='newBook()'>＋</button></span>")}<main class="page">
 <div class="filters"><button class="pill on">本棚</button><button class="pill">未読</button><button class="pill">読書中</button><button class="pill">読了</button></div>
 <div class="grid">${data.books.map(b=>`<div class="book" onclick="detail('${b.id}')">${cover(b)}<div class="bn">${esc(b.title)}</div><div class="meta">${(b.volumes||[]).length}巻　${bcount(b).toLocaleString()}文字</div></div>`).join("")}</div></main>`;
}
function detail(bid){
 if(bid)st.book=bid;let b=B();if(!b)return shelf();
 $("#app").innerHTML=`${top(b.title,"shelf()","<button class='secondary' onclick='editBook()'>編集</button>")}<main class="page">
 <div class="detail">${cover(b)}<div><div class="dname">${esc(b.title)}</div><div class="stats">${b.volumes.length}巻<br>総文字数 ${bcount(b).toLocaleString()}文字</div><div class="actions"><button class="primary" onclick="cont()">続きを読む</button><button class="secondary" onclick="addVol()">＋ 巻を追加</button></div></div></div>
 <h2>巻一覧</h2>${b.volumes.map(v=>`<div class="vol"><div class="vh"><span>${esc(v.name)}</span><span>${v.chapters.reduce((a,c)=>a+chars(c.text),0).toLocaleString()}文字</span></div>${v.chapters.map((c,i)=>`<div class="ch" onclick="reader('${v.id}','${c.id}')"><div class="cm"><div class="ct">${esc(c.title||"Chapter "+String(i+1).padStart(2,"0"))}</div><div class="preview">${esc(c.text.slice(0,70))}</div></div><div class="cc">${chars(c.text).toLocaleString()}文字 ›</div></div>`).join("")}<div class="ch"><button class="secondary" onclick="addCh('${v.id}')">＋ チャプター追加</button></div></div>`).join("")}</main>`;
}
function cont(){let b=B(),v=b?.volumes?.[0],c=v?.chapters?.[0];if(c)reader(v.id,c.id)}
function reader(vid,cid){
 if(vid)st.vol=vid;if(cid)st.ch=cid;let c=C();if(!c)return detail();
 $("#app").innerHTML=`<div class="reader">${top(c.title||"Chapter","detail()","<button class='secondary' onclick='editCh()'>編集</button>")}<div class="rb"><div id="txt" class="text ${st.vertical?"vert":""}">${esc(c.text)}</div></div><div class="controls"><button class="${!st.vertical?"on":""}" onclick="direction(false)">横書き</button><button class="${st.vertical?"on":""}" onclick="direction(true)">縦書き</button><button onclick="fs(-1)">A−</button><button onclick="fs(1)">A＋</button></div></div>`;
}
function direction(x){st.vertical=x;localStorage.setItem("vertical",x?"1":"0");reader()}
function fs(d){let e=$("#txt"),n=parseFloat(getComputedStyle(e).fontSize)+d;e.style.fontSize=Math.max(14,Math.min(34,n))+"px"}
function addVol(){let b=B();b.volumes.push({id:id("v"),name:`第${b.volumes.length+1}巻`,chapters:[]});save();detail()}
function addCh(vid){let v=B().volumes.find(x=>x.id===vid);v.chapters.push({id:id("c"),title:`Chapter ${String(v.chapters.length+1).padStart(2,"0")}`,text:""});save();detail()}
function editCh(){let c=C();modal(`<h2>チャプター編集</h2><div class="field"><label>タイトル</label><input id="ect" value="${esc(c.title)}"></div><div class="field"><label>本文（${chars(c.text).toLocaleString()}文字）</label><textarea id="ecx">${esc(c.text)}</textarea></div><div class="actions"><button class="primary" onclick="saveCh()">保存</button><button class="secondary danger" onclick="delCh()">削除</button><button class="secondary" onclick="closeM()">閉じる</button></div>`)}
function saveCh(){let c=C();c.title=$("#ect").value;c.text=$("#ecx").value;save();closeM();reader()}
function delCh(){if(!confirm("このチャプターを削除しますか？"))return;let v=V();v.chapters=v.chapters.filter(x=>x.id!==st.ch);v.chapters.forEach((c,i)=>c.title=`Chapter ${String(i+1).padStart(2,"0")}`);save();closeM();detail()}
function editBook(){let b=B();modal(`<h2>作品設定</h2><div class="field"><label>作品タイトル</label><input id="bt" value="${esc(b.title)}"></div><div class="field"><label>表紙画像URL</label><input id="bc" value="${esc(b.cover||"")}"></div><div class="actions"><button class="primary" onclick="saveBook()">保存</button><button class="secondary danger" onclick="delBook()">作品を削除</button><button class="secondary" onclick="closeM()">閉じる</button></div>`)}
function saveBook(){let b=B();b.title=$("#bt").value.trim()||b.title;b.cover=$("#bc").value.trim();save();closeM();detail()}
function delBook(){if(!confirm("作品を削除しますか？"))return;data.books=data.books.filter(x=>x.id!==st.book);save();closeM();shelf()}
function newBook(){modal(`<h2>本を追加</h2><div class="field"><label>作品タイトル</label><input id="nt" placeholder="作品名"></div><div class="actions"><button class="primary" onclick="createBook()">追加</button><button class="secondary" onclick="closeM()">キャンセル</button></div>`)}
function createBook(){let t=$("#nt").value.trim()||"新しい小説";data.books.push({id:id("b"),title:t,cover:"",volumes:[]});save();closeM();shelf()}
shelf();
</script>
</body>
</html>
