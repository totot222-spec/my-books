<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d7ce0">
<link rel="manifest" href="manifest.json">
<title>My Books v1.2</title>
<style>
:root{
  --accent:#3d7ce0; --accent-dark:#2f66c2; --bg:#f5f8fc; --paper:#fdfdfb; --text:#1c2430; --muted:#8a94a3;
  --line:#e3e8f0; --card:#fff; --shadow:0 8px 24px rgba(31,60,110,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic",sans-serif}
button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh;padding-bottom:96px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{height:72px;position:relative;padding:0 16px}
.topbar-inner>.navback{position:absolute;left:16px;top:50%;transform:translateY(-50%)}
.topbar-inner>.row{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:10px;flex-wrap:nowrap}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.iconbtn.small{width:38px;height:38px;font-size:16px}
.title-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:19px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 220px)}
.navback{font-size:16px;font-weight:700;color:var(--accent);flex:0 0 auto}
.navedit{font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap;flex:0 0 auto;padding:6px 2px}

.page{max-width:1050px;margin:auto;padding:18px 18px}

/* tab bar (status filter) */
.tabbar{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}
.tab{padding:12px 1px;font-size:14.5px;color:var(--muted);font-weight:700;white-space:nowrap;position:relative}
.tab.active{color:var(--accent)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);border-radius:3px 3px 0 0}

/* cover picker */
.cover-pick{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.cover-pick .cover{width:76px;flex:0 0 auto}
.cover-pick .pickbtns{flex:1;display:flex;flex-direction:column;gap:8px}
.filehint{font-size:11.5px;color:var(--muted)}

/* section headers */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.section-head h2{font-size:18px;font-weight:800;margin:0}

/* book grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 12px}
@media(max-width:420px){.grid{gap:18px 8px}}
.book{cursor:pointer;min-width:0}
.cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#eee;box-shadow:var(--shadow);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.placeholder{background:linear-gradient(150deg,#173463,#3d7ce0 55%,#8fc1f0);color:white;padding:14px;display:flex;align-items:flex-end}
.cover.placeholder span{font-family:serif;font-size:16px;line-height:1.3;font-weight:700;white-space:pre-line}
.book-name{font-size:13.5px;font-weight:750;margin-top:8px;line-height:1.3}
.book-meta{color:var(--muted);font-size:11px;margin-top:2px}
.book-author{color:var(--muted);font-size:11.5px;margin-top:1px}
.empty{text-align:center;color:var(--muted);padding:70px 10px}

/* detail */
.detail-head{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:start}
.detail-name{font-size:24px;font-weight:850;margin:2px 0 8px;line-height:1.3}
.detail-author{color:var(--muted);font-size:14px;margin:-4px 0 8px}
.detail-stat{color:var(--muted);font-size:13.5px;line-height:1.7}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.tag{background:#eaf1fc;color:var(--accent-dark);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}

.primary{background:var(--accent);color:#fff;padding:13px 22px;border-radius:14px;font-weight:750}
.primary:active{background:var(--accent-dark)}
.secondary{background:#fff;border:1px solid var(--line);padding:11px 16px;border-radius:14px;color:var(--accent-dark);font-weight:600}
.fullbtn{width:100%;font-size:15.5px;margin-top:18px}
.section-link{font-size:13px;color:var(--accent);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* volumes */
.volumes-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.volrow{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.volgroup:last-child .volrow{border-bottom:0}
.volgroup:last-child .chapter-list:not(.hidden)~.volrow{}
.volicon{width:42px;height:54px;border-radius:8px;flex:0 0 auto;background:linear-gradient(150deg,#173463,#3d7ce0);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;text-align:center;line-height:1.2;overflow:hidden;position:relative}
.volicon img{width:100%;height:100%;object-fit:cover;display:block}
.volinfo{flex:1;min-width:0}
.volinfo b{display:block;font-size:15px;font-weight:750}
.volinfo span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.chev{color:#c6ccd6;font-size:19px;flex:0 0 auto}
.chapter-list{border-top:1px solid var(--line);background:#fafbfd}
.chapter{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);cursor:pointer}
.chapter-move{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.chapter-move button{width:26px;height:22px;font-size:10px;line-height:1;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center}
.chapter-move button:disabled{opacity:.25}
.chapter-move button:not(:disabled):active{background:#eaf1fc;color:var(--accent-dark)}
.chapter-merge{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:5px;display:inline-block}
.chapter:last-child{border-bottom:0}
.chapter-main{flex:1;min-width:0}
.chapter-name{font-weight:700;font-size:14.5px}
.chapter-desc{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.chapter-count{font-size:12px;color:var(--muted);white-space:nowrap}
.addrow{padding:14px 16px}

/* synopsis */
.synopsis{color:#4a5468;line-height:1.8;font-size:14px}
.synopsis.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{color:var(--accent);font-weight:700;font-size:13px;margin-top:8px}

/* editor */
.editor{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:#666;margin-bottom:7px}
.field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:10px}
.field-head label{margin-bottom:0}
.texticons{display:flex;gap:16px;flex:0 0 auto}
.texticons button{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap;padding:2px 0}
.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;border-radius:12px;padding:11px;background:#fff}
.field textarea{min-height:200px;line-height:1.8;resize:vertical}
.fmtopts{display:flex;flex-direction:column;gap:9px;background:#fafbfd;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:#222;line-height:1.4}
.chk input{width:auto;margin-top:2px;flex:0 0 auto}
.chk-text{display:block;font-weight:700}
.chk-sub{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:2px;line-height:1.4}
.repl-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.repl-row input{flex:1}
.repl-box{background:#fafbfd;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.repl-item{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.repl-item:last-of-type{border-bottom:0}
.repl-item input{flex:1;min-width:0;border:1px solid #ddd;border-radius:9px;padding:8px 10px;background:#fff;font-size:13.5px}
.repl-arrow{flex:0 0 auto;color:var(--muted);font-size:14px}
.repl-del{flex:0 0 auto;color:#d33;font-size:16px;padding:2px 6px}
.repl-empty{font-size:12.5px;color:var(--muted);padding:4px 0 8px}
.repl-add{width:100%;margin-top:9px;font-size:13px;padding:9px}

/* reader */
.reader{min-height:100vh;background:var(--paper);color:var(--text)}
.reader[data-theme=sepia]{--paper:#f3e9d3;--text:#3c2f20}
.reader[data-theme=dark]{--paper:#1b1e23;--text:#dfe2e7}
.reader-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:transform .25s ease}
.reader-top.reader-top-hidden{transform:translateY(-100%)}
.reader[data-theme=sepia] .reader-top{background:rgba(243,233,211,.92)}
.reader[data-theme=dark] .reader-top{background:rgba(27,30,35,.92);border-color:#333}
.reader-body{max-width:900px;margin:auto;padding:26px 24px 30px}
.reader-text{font-family:"Hiragino Mincho ProN","HiraMinProN-W3","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif KR",serif;font-size:21px;line-height:1.75;letter-spacing:.01em;white-space:pre-wrap;color:var(--text)}
.reader-text.vertical{writing-mode:vertical-rl;text-orientation:mixed;line-height:1.7;letter-spacing:.03em;overflow-x:auto;max-width:100%;height:calc(100vh - 230px);white-space:pre-wrap}
.progresswrap{max-width:520px;margin:0 auto 110px;padding:0 24px}
input[type=range].seek{width:100%;accent-color:var(--accent)}
.seek-label{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.toolbar4{position:fixed;z-index:30;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.05);border-radius:16px;padding:5px;display:flex;gap:2px;box-shadow:0 3px 12px rgba(31,60,110,.07);opacity:.62;transition:opacity .2s}
.toolbar4:hover,.toolbar4:focus-within{opacity:1}
.reader[data-theme=sepia] .toolbar4{background:rgba(243,233,211,.72);border-color:rgba(0,0,0,.06)}
.reader[data-theme=dark] .toolbar4{background:rgba(27,30,35,.72);border-color:rgba(255,255,255,.08)}
.toolbar4 button{display:flex;flex-direction:row;align-items:center;gap:5px;font-size:11.5px;color:#7a828f;padding:7px 11px;border-radius:11px;font-weight:600;white-space:nowrap;writing-mode:horizontal-tb}
.reader[data-theme=dark] .toolbar4 button{color:#9aa3b0}
.toolbar4 button .ic{font-size:14px;line-height:1}
.toolbar4 button.active{background:#eaf1fc;color:var(--accent-dark)}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:100;display:flex;align-items:flex-end}
.modal{background:#fff;width:100%;max-height:85vh;border-radius:24px 24px 0 0;padding:20px;overflow:auto}
.modal h2{margin:0 0 18px;font-size:18px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.danger{color:#d33}
.search{width:100%;padding:12px 16px;border:1px solid #ddd;border-radius:14px;background:#fff;margin-bottom:16px}
.small{font-size:13px;color:var(--muted)}

/* bottom nav */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;z-index:50}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 14px;font-size:11px;color:#8a94a3;font-weight:600}
.navbtn .ic{font-size:21px}
.navbtn.active{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="my-books-v1";
const defaultData={
 books:[
  {id:"book1",title:"サンプル小説",cover:"",status:"reading",
   tags:["青春","恋愛"],
   synopsis:"高校2年の夏。海の見える町で、僕たちは出会った。何気ない日々のなかで、少しずつ変わっていく気持ち。これは、あの夏を忘れないための物語。",
   volumes:[
   {id:"v1",name:"第1巻",chapters:[
    {id:"c1",title:"Chapter 01",text:"「これはサンプルの文章です。」\n\nジェギョンは静かに窓の外を見た。\n「今日は寒いね。」\n「そうだな。」"}
   ]}
  ]},
  {id:"book2",title:"ホンブル",cover:"",status:"unread",tags:[],synopsis:"",volumes:[
   {id:"v1",name:"第1巻",chapters:[
    {id:"c1",title:"Chapter 01",text:"「サンプルの会話文です。」\n\nここから地の文が続きます。"}
   ]}
  ]}
 ],
 replacements:[]
};
let data;
try { data=JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e) { data=null; }
function normalizeData(d){
  if(!d || !Array.isArray(d.books)) return structuredClone(defaultData);
  d.books=d.books.map((b,i)=>({
    id:b.id||uid("b"), title:b.title||`作品${i+1}`, cover:b.cover||"",
    status:["unread","reading","done"].includes(b.status)?b.status:"unread",
    tags:Array.isArray(b.tags)?b.tags:[],
    synopsis:typeof b.synopsis==="string"?b.synopsis:"",
    author:typeof b.author==="string"?b.author:"",
    volumes:Array.isArray(b.volumes)?b.volumes.map((v,j)=>({
      id:v.id||uid("v"), name:v.name||`第${j+1}巻`, cover:v.cover||"",
      chapters:Array.isArray(v.chapters)?v.chapters.map((c,k)=>({
        id:c.id||uid("c"), title:c.title||`Chapter ${String(k+1).padStart(2,"0")}`, text:typeof c.text==="string"?c.text:""
      })):[]
    })):[]
  }));
  d.replacements=Array.isArray(d.replacements)?d.replacements.filter(r=>r&&typeof r.from==="string").map(r=>({from:r.from,to:typeof r.to==="string"?r.to:""})):[];
  return d;
}
data=normalizeData(data);
let state={screen:"shelf",bookId:null,volumeId:null,chapterId:null,vertical:false,search:"",filter:"all",readerScrollRatio:0,chapterEditMode:false};

function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function book(){return data.books.find(x=>x.id===state.bookId)}
function volume(){return book()?.volumes.find(x=>x.id===state.volumeId)}
function chapter(){return volume()?.chapters.find(x=>x.id===state.chapterId)}
function count(s){return [...(s||"")].filter(c=>!/\s/.test(c)).length}
function totalBook(b){return b.volumes.reduce((a,v)=>a+v.chapters.reduce((x,c)=>x+count(c.text),0),0)}

/* ---- translation cleanup tools ---- */
function normalizeBlankLines(text){
 return text.replace(/\n{3,}/g,"\n\n");
}
function fixDuplicateBrackets(text){
 let out=text;
 const collapse=(re,rep)=>{ let prev; do{ prev=out; out=out.replace(re,rep); }while(out!==prev); };
 collapse(/「[ \t　]*「/g,"「");
 collapse(/」[ \t　]*」/g,"」");
 collapse(/『[ \t　]*『/g,"『");
 collapse(/』[ \t　]*』/g,"』");
 out=out.replace(/["“]{2,}/g,"「").replace(/["”]{2,}/g,"」");
 return out;
}
function normalizeEllipsis(text){
 return text.replace(/\.{4,}/g,"……").replace(/。{4,}/g,"……").replace(/…{3,}/g,"……");
}
function findBracketIssuesFor(text,openCh,closeCh,label){
 let lines=text.split("\n"); let balance=0; let issues=[];
 lines.forEach((line,idx)=>{
  for(const ch of line){
   if(ch===openCh) balance++;
   else if(ch===closeCh){
    balance--;
    if(balance<0){ issues.push(`${idx+1}行目: 対応する${openCh}のない${closeCh}があります`); balance=0; }
   }
  }
 });
 if(balance>0) issues.push(`${label}が${balance}個閉じられていません（${closeCh}が見つかりません）`);
 return issues;
}
function findBracketIssues(text){
 return [...findBracketIssuesFor(text,"「","」","「"),...findBracketIssuesFor(text,"『","』","『")];
}
function applyReplacements(text){
 let out=text;
 (data.replacements||[]).forEach(r=>{
  if(!r.from) return;
  out=out.split(r.from).join(r.to??"");
 });
 return out;
}
function joinBrokenLines(text){
 // 行末が句点などの文末記号で終わっていない行は、OCRの改行ズレとみなして次の行と結合する
 const enders=["。","！","？","」","…","』","”"];
 let lines=text.split("\n");
 let out=[]; let buffer=null;
 lines.forEach(raw=>{
  let line=raw;
  if(line.trim()===""){ if(buffer!==null){out.push(buffer);buffer=null;} out.push(""); return; }
  if(line.trim()==="***"){ if(buffer!==null){out.push(buffer);buffer=null;} out.push(line.trim()); return; }
  let trimmedEnd=line.replace(/[\s　]+$/,"");
  buffer = buffer===null ? trimmedEnd : buffer+trimmedEnd;
  let lastChar=buffer.slice(-1);
  if(enders.includes(lastChar)){ out.push(buffer); buffer=null; }
 });
 if(buffer!==null) out.push(buffer);
 return out.join("\n");
}
function insertDialogueBreaksBefore(text){
 // 文末記号（。！？…」』）の直後にある「または-は、会話の始まりとみなして直前に改行する。
 // 文の途中（助詞などの後）にある「はそのまま＝説明・強調の「」として扱い、改行しない。
 const sentenceEnd=["。","！","？","…","」","』"];
 const openers=["「","-"];
 let result="";
 for(let i=0;i<text.length;i++){
  let ch=text[i];
  if(openers.includes(ch)){
   let prev=result.length?result[result.length-1]:"\n";
   let atLineStart=prev==="\n";
   let afterSentenceEnd=sentenceEnd.includes(prev);
   if(!atLineStart && afterSentenceEnd) result+="\n";
  }
  result+=ch;
 }
 return result;
}
function insertDialogueBreaks(text){
 // 「」の直後が助詞・読点などの続き言葉でなければ、会話文の終わりとみなして改行する
 const continuations=["と","という","っていう","とか","も","は","が","を","に","で","や","の","から","まで","ば","たら","なら","って","、","）",")","」","』"];
 let result="";
 for(let i=0;i<text.length;i++){
  let ch=text[i];
  result+=ch;
  if(ch==="」"){
   let next=text[i+1];
   if(next===undefined||next==="\n") continue;
   let rest=text.slice(i+1);
   let isContinuation=continuations.some(c=>rest.startsWith(c));
   if(!isContinuation) result+="\n";
  }
 }
 return result;
}
function addSceneBreakSpacing(text){
 let lines=text.split("\n"); let out=[];
 for(let i=0;i<lines.length;i++){
  let line=lines[i];
  if(line.trim()==="***"){
   while(out.length&&out[out.length-1].trim()==="") out.pop();
   if(out.length) out.push("");
   out.push("***");
   let j=i+1; while(j<lines.length&&lines[j].trim()==="") j++;
   out.push(""); i=j-1;
  } else out.push(line);
 }
 while(out.length&&out[0].trim()==="") out.shift();
 while(out.length&&out[out.length-1].trim()==="") out.pop();
 return out.join("\n");
}
function replListHTML(){
 const list=data.replacements||[];
 if(!list.length) return '<div class="repl-empty">まだ登録されていません。「＋ 語句を追加」から登録してください。</div>';
 return list.map((r,i)=>`<div class="repl-item">
  <input value="${esc(r.from)}" placeholder="変換前" onchange="updateReplacement(${i},'from',this.value)">
  <span class="repl-arrow">→</span>
  <input value="${esc(r.to)}" placeholder="変換後" onchange="updateReplacement(${i},'to',this.value)">
  <button class="repl-del" onclick="removeReplacementInline(${i})">✕</button>
 </div>`).join("");
}
function refreshReplList(){
 const box=document.getElementById("repl-list");
 if(box) box.innerHTML=replListHTML();
}
function addReplacementInline(){
 data.replacements=data.replacements||[];
 data.replacements.push({from:"",to:""});
 save(); refreshReplList();
}
function removeReplacementInline(i){
 data.replacements.splice(i,1); save(); refreshReplList();
}
function runReplacements(){
 const el=document.getElementById("ec-text");
 if(!el) return;
 const list=(data.replacements||[]).filter(r=>r.from);
 if(!list.length){alert("置き換える語句が登録されていません。");return}
 const scope=document.querySelector('input[name="repl-scope"]:checked')?.value||"chapter";
 const st=document.getElementById("repl-status");
 if(scope==="chapter"){
  const before=el.value;
  el.value=applyReplacements(before);
  const lbl=document.getElementById("ec-count");
  if(lbl) lbl.textContent=count(el.value).toLocaleString()+"文字";
  let changed=0;
  list.forEach(r=>{changed+=before.split(r.from).length-1});
  if(st) st.textContent=changed?`このチャプターで${changed}箇所を置き換えました（保存を押すと確定）`:"該当する語句はありませんでした";
  return;
 }
 const b=book();

 // 編集中のチャプターは、未保存のテキストエリアの内容を正として扱う
 const cur=chapter();
 if(cur) cur.text=el.value;
 b.volumes.forEach(v=>v.chapters.forEach(c=>{
  let hits=0;

}
function adjustDialogueSpacing(delta){
 const ta=document.getElementById("ec-text");
 if(!ta) return;
 let lines=ta.value.split("\n");
 let out=[]; let i=0;
 const isDialogueLine=s=>/^[「『]/.test(s.trim());
 while(i<lines.length){
  let line=lines[i];
  if(isDialogueLine(line)){
   let blankBefore=0;
   while(out.length && out[out.length-1].trim()==="") { out.pop(); blankBefore++; }
   let newBefore=Math.max(0,blankBefore+delta);
   if(out.length){ for(let k=0;k<newBefore;k++) out.push(""); }
   out.push(line);
   let j=i+1,blankAfter=0;
   while(j<lines.length && lines[j].trim()===""){ blankAfter++; j++; }
   let hasNext=j<lines.length;
   let newAfter=Math.max(0,blankAfter+delta);
   if(hasNext){ for(let k=0;k<newAfter;k++) out.push(""); }
   i=j;
  } else { out.push(line); i++; }
 }
 ta.value=out.join("\n");
 const lbl=document.getElementById("ec-count");
 if(lbl) lbl.textContent=count(ta.value).toLocaleString()+"文字";
}
function runFormatTools(){
 let el=document.getElementById("ec-text");
 if(!el) return;
 let text=el.value;
 if(document.getElementById("ft-brackets")?.checked) text=fixDuplicateBrackets(text);
 if(document.getElementById("ft-ellipsis")?.checked) text=normalizeEllipsis(text);
 if(document.getElementById("ft-joinlines")?.checked) text=joinBrokenLines(text);
 if(document.getElementById("ft-dialogue")?.checked) text=insertDialogueBreaksBefore(text);
 if(document.getElementById("ft-dialogue")?.checked) text=insertDialogueBreaks(text);
 if(document.getElementById("ft-scene")?.checked) text=addSceneBreakSpacing(text);
 if(document.getElementById("ft-blanklines")?.checked) text=normalizeBlankLines(text);
 el.value=text;
 let lbl=document.getElementById("ec-count");
 if(lbl) lbl.textContent=count(text).toLocaleString()+"文字";
 let fst=document.getElementById("fmt-status");
 if(fst){
  const issues=findBracketIssues(text);
  fst.innerHTML = issues.length
   ? `⚠️ 鉤括弧の対応が取れていない箇所があります（自動修正はしていません。文脈を見て手動で直してください）<br>`+issues.map(i=>esc(i)).join("<br>")
   : `鉤括弧の対応は取れています`;
 }
}

function resizeImageFile(file,maxDim,cb){
 const reader=new FileReader();
 reader.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   let w=img.width,h=img.height;
   if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim} } else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim} }
   const canvas=document.createElement("canvas");
   canvas.width=w;canvas.height=h;
   canvas.getContext("2d").drawImage(img,0,0,w,h);
   cb(canvas.toDataURL("image/jpeg",0.82));
  };
  img.onerror=()=>alert("画像を読み込めませんでした");
  img.src=e.target.result;
 };
 reader.onerror=()=>alert("ファイルを読み込めませんでした");
 reader.readAsDataURL(file);
}

function jumpTextareaToReadingPosition(){
 const ta=document.getElementById("ec-text");
 if(!ta) return;
 const ratio=typeof state.readerScrollRatio==="number"?state.readerScrollRatio:0;
 const len=ta.value.length;
 if(len===0) return;
 const target=Math.max(0,Math.min(len,Math.round(ratio*len)));
 const start=Math.max(0,target-18);
 const end=Math.min(len,target+18);
 requestAnimationFrame(()=>{
  ta.focus();
  try{ ta.setSelectionRange(start,end); }catch(e){}
  if(ta.scrollHeight>ta.clientHeight){ ta.scrollTop=ratio*(ta.scrollHeight-ta.clientHeight); }
  const hint=document.getElementById("ec-jumphint");
  if(hint && ratio>0) hint.textContent="読んでいた位置あたりを選択表示しています";
 });
}

function mergeChapterWithNext(vid,cid){
 const v=book().volumes.find(x=>x.id===vid);
 if(!v) return;
 const idx=v.chapters.findIndex(c=>c.id===cid);
 if(idx<0||idx>=v.chapters.length-1) return;
 const cur=v.chapters[idx], next=v.chapters[idx+1];
 if(!confirm(`「${cur.title}」と「${next.title}」を結合します。\n（${next.title}の本文は${cur.title}の末尾に追加され、${next.title}は削除されます）`)) return;
 cur.text = cur.text + (cur.text.trim()&&next.text.trim()?"\n\n":"") + next.text;
 v.chapters.splice(idx+1,1);
 try{save()}catch(e){alert("保存できませんでした。容量が上限に達した可能性があります。")}
 renderDetail();
}
function moveChapter(vid,cid,dir){
 const v=book().volumes.find(x=>x.id===vid);
 if(!v) return;
 const idx=v.chapters.findIndex(c=>c.id===cid);
 const newIdx=idx+dir;
 if(idx<0||newIdx<0||newIdx>=v.chapters.length) return;
 const tmp=v.chapters[idx];
 v.chapters[idx]=v.chapters[newIdx];
 v.chapters[newIdx]=tmp;
 save();
 renderDetail();
}

function importTextFiles(inputEl,vid){
 const files=[...inputEl.files];
 inputEl.value="";
 if(!files.length) return;
 files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
 let texts=new Array(files.length); let done=0;
 files.forEach((f,i)=>{
  const r=new FileReader();
  r.onload=()=>{
   texts[i]={name:f.name.replace(/\.[^.]+$/,""),body:String(r.result||"")};
   if(++done===files.length) finishFileImport(vid,texts);
  };
  r.onerror=()=>{
   texts[i]={name:f.name,body:""};
   if(++done===files.length) finishFileImport(vid,texts);
  };
  r.readAsText(f,"utf-8");
 });
}
function finishFileImport(vid,texts){
 const joined=texts.map(t=>t.body).join("\n");
 modal(`<h2>ファイルから読み込み</h2>
 <div class="small" style="margin-bottom:12px">${texts.length}個のファイルを読み込みました（ファイル名順）。</div>
 <div class="field"><label>取り込み方法</label>
  <div class="fmtopts">
   <label class="chk"><input type="radio" name="fi-mode" value="perfile" ${texts.length>1?"checked":""}> ファイル1つ＝1チャプター（ファイル名をタイトルに）</label>
   <label class="chk"><input type="radio" name="fi-mode" value="marker" ${texts.length>1?"":"checked"}> 全部つなげて、区切り文字で分割する</label>
  </div>
 </div>
 <div class="field"><label>章の区切り文字（上の「区切り文字で分割」を選んだ場合）</label><input id="fi-marker" placeholder="例: 제1장"></div>
 <div class="field"><label>プレビュー（先頭200文字）</label><textarea readonly style="min-height:110px">${esc(joined.slice(0,200))}</textarea></div>
 <div class="actions"><button class="primary" onclick='runFileImport("${vid}")'>インポート</button><button class="secondary" onclick="closeModal()">キャンセル</button></div>`);
 window.__pendingFiles=texts;
}
function runFileImport(vid){
 const texts=window.__pendingFiles||[];
 if(!texts.length){closeModal();return}
 const mode=document.querySelector('input[name="fi-mode"]:checked')?.value||"perfile";
 const marker=document.getElementById("fi-marker").value.trim();
 let v=book().volumes.find(x=>x.id===vid);
 if(!v){closeModal();return}
 if(mode==="perfile"){
  texts.forEach(t=>{
   v.chapters.push({id:uid("c"),title:t.name||`Chapter ${String(v.chapters.length+1).padStart(2,"0")}`,text:t.body.trim()});
  });
 } else {
  const all=texts.map(t=>t.body).join("\n");
  let chunks=[];
  if(marker){
   let cur=null;
   all.split("\n").forEach(line=>{
    if(line.trim().startsWith(marker)){
     if(cur) chunks.push(cur);
     cur={title:line.trim(),body:[]};
    } else {
     if(!cur) cur={title:"",body:[]};
     cur.body.push(line);
    }
   });
   if(cur) chunks.push(cur);
  } else chunks=[{title:"",body:all.split("\n")}];
  chunks.forEach(ch=>{
   v.chapters.push({id:uid("c"),title:ch.title||`Chapter ${String(v.chapters.length+1).padStart(2,"0")}`,text:ch.body.join("\n").trim()});
  });
 }
 window.__pendingFiles=null;
 try{save()}catch(e){alert("保存できませんでした。容量が上限に達した可能性があります。")}
 closeModal();renderDetail();
}

 <div class="field"><label>章の区切り文字（任意）</label><input id="bi-marker" placeholder="例: 제1장 　※この文字で始まる行で章を分割します"></div>
 <div class="field"><label>OCRテキストを貼り付け</label>

 </div>

function runBulkImport(vid){
 const text=document.getElementById("bi-text").value;
 const marker=document.getElementById("bi-marker").value.trim();
 if(!text.trim()){alert("テキストが空です");return}
 let v=book().volumes.find(x=>x.id===vid);
 let chunks=[];
 if(marker){
  let lines=text.split("\n");
  let cur=null;
  lines.forEach(line=>{
   if(line.trim().startsWith(marker)){
    if(cur) chunks.push(cur);
    cur={title:line.trim(),body:[]};
   } else {
    if(!cur) cur={title:"",body:[]};
    cur.body.push(line);
   }
  });
  if(cur) chunks.push(cur);
 } else {
  chunks=[{title:"",body:text.split("\n")}];
 }
 chunks.forEach(ch=>{
  v.chapters.push({id:uid("c"),title:ch.title||`Chapter ${String(v.chapters.length+1).padStart(2,"0")}`,text:ch.body.join("\n").trim()});
 });
 save();closeModal();renderDetail();
}

window.addEventListener("scroll",()=>{
 const bodyEl=document.querySelector(".reader-body");
 if(!bodyEl) return;
 const rect=bodyEl.getBoundingClientRect();
 const bodyTop=rect.top+window.scrollY;
 const scrollable=Math.max(1,bodyEl.scrollHeight-window.innerHeight);
 const scrolledIntoBody=window.scrollY-bodyTop;
 state.readerScrollRatio=Math.max(0,Math.min(1,scrolledIntoBody/scrollable));

 const topEl=document.getElementById("readerTop");
 if(topEl){
  const cur=window.scrollY;
  const delta=cur-lastScrollY;
  if(cur<=8){
   topEl.classList.remove("reader-top-hidden");
  } else if(delta>4){
   topEl.classList.add("reader-top-hidden");
  } else if(delta<-4){
   topEl.classList.remove("reader-top-hidden");
  }
  lastScrollY=cur;
 }
},{passive:true});
