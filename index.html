<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7fbfe">

<title>My Books</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#f7fbfe;
  color:#202124;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

button{
  font:inherit;
  border:0;
  background:none;
  color:inherit;
}

/* ヘッダー */

.header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;

  background:rgba(250,253,255,.96);
  border-bottom:1px solid #e2eaf0;

  position:sticky;
  top:0;
  z-index:10;
}

.header-space{
  width:96px;
}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);

  font-size:20px;
  font-weight:800;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.icon-button{
  width:43px;
  height:43px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
  background:#fff;

  font-size:23px;

  box-shadow:0 3px 14px rgba(49,91,116,.08);
}

/* メイン */

.page{
  max-width:900px;
  margin:0 auto;
  padding:22px 18px 100px;
}

/* フィルター */

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:20px;
}

.filter{
  flex:none;
  padding:9px 17px;

  background:#fff;
  border:1px solid #dce6ed;
  border-radius:999px;

  font-size:14px;
}

.filter.active{
  color:#1686e8;
  border-color:#1686e8;
  background:#f5fbff;
  font-weight:700;
}

/* セクションタイトル */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:8px 0 16px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.count{
  font-size:13px;
  color:#1686e8;
  font-weight:700;
}

/* 本棚 */

.books{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:25px 14px;
}

.book{
  min-width:0;
}

.cover{
  aspect-ratio:2/3;
  border-radius:8px;
  overflow:hidden;

  display:flex;
  align-items:flex-end;

  padding:14px;

  background:
    linear-gradient(
      145deg,
      #8fcbed,
      #dff4ff 55%,
      #7eb4d6
    );

  box-shadow:
    0 7px 20px rgba(65,100,124,.14);

  color:#fff;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:17px;
  font-weight:700;

  text-shadow:0 2px 8px rgba(0,0,0,.3);
}

.book-title{
  margin-top:9px;

  font-size:15px;
  font-weight:750;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.book-meta{
  margin-top:4px;

  color:#818994;
  font-size:12px;
}

@media(max-width:390px){

  .books{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

</style>
</head>

<body>

<div id="app"></div>

<script>

const books = [
  {
    title:"サンプル小説",
    volumes:1
  },
  {
    title:"ホンブル",
    volumes:1
  },
  {
    title:"テスト作品",
    volumes:2
  }
];

function showShelf(){

  const app =
    document.getElementById("app");

  app.innerHTML = `

    <header class="header">

      <div class="header-space"></div>

      <div class="title">
        本棚
      </div>

      <div class="header-buttons">

        <button class="icon-button">
          ⌕
        </button>

        <button class="icon-button">
          ＋
        </button>

      </div>

    </header>

    <main class="page">

      <div class="filters">

        <button class="filter active">
          本棚
        </button>

        <button class="filter">
          未読
        </button>

        <button class="filter">
          読書中
        </button>

        <button class="filter">
          読了
        </button>

      </div>

      <div class="section-title">

        <h2>
          マイライブラリ
        </h2>

        <div class="count">
          ${books.length}作品
        </div>

      </div>

      <div class="books">

        ${books.map(book => `

          <div class="book">

            <div class="cover">
              ${book.title}
            </div>

            <div class="book-title">
              ${book.title}
            </div>

            <div class="book-meta">
              ${book.volumes}巻
            </div>

          </div>

        `).join("")}

      </div>

    </main>

  `;
}

showShelf();

</script>

</body>
</html>
