<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>My Books v1.2</title>
<style>
:root{
  --accent:#1687f8; --accent2:#2d9cff; --bg:#f6f9fc; --paper:#fffdf8;
  --text:#111827; --muted:#7b8794; --line:#e6edf4; --card:#fff;
  --shadow:0 8px 26px rgba(35,85,125,.09);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.app{min-height:100vh;padding-bottom:92px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar-inner{height:68px;display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:0 16px}
.topbar-inner>.row{justify-content:flex-end}
.logo{font-weight:800;font-size:24px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid #e7eef5;box-shadow:0 4px 14px rgba(35,85,125,.07);display:grid;place-items:center;font-size:24px}
.title-center{text-align:center;font-size:18px;font-weight:850}
.page{max-width:900px;margin:auto;padding:16px 16px 112px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 -16px 18px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.pill{position:relative;padding:14px 4px 13px;border:0;border-radius:0;background:transparent;white-space:nowrap;color:#66717d;font-size:14px}
.pill.active{color:var(--accent);font-weight:800}
.pill.active:after{content:"";position:absolute;left:15%;right:15%;bottom:-1px;height:3px;background:var(--accent);border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 13px}
@media(min-width:760px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 20px}}
.book{cursor:pointer;min-width:0}
.cover{aspect-ratio:2/3;border-radius:7px;overflow:hidden;background:#e9f2fa;box-shadow:var(--shadow);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.placeholder{background:linear-gradient(155deg,#d9edff,#8fc8f7 60%,#eef8ff);color:#fff;padding:12px;display:flex;align-items:flex-end}
.cover.placeholder:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(18,91,148,.28))}
.cover.placeholder span{position:relative;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px;line-height:1.4;font-weight:800;white-space:pre-line;text-shadow:0 1px 5px rgba(0,0,0,.22)}
.book-name{font-size:14px;font-weight:800;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-meta{color:var(--muted);font-size:12px;margin-top:3px}
.progress{height:4px;background:#e5edf4;border-radius:5px;margin-top:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:70px 10px}
.section-title{font-size:19px;font-weight:850;margin:26px 0 12px}
.detail-head{display:grid;grid-template-columns:135px 1fr;gap:18px;align-items:start}
.detail-name{font-size:23px;font-weight:900;margin:2px 0 7px}
.detail-stat{color:var(--muted);line-height:1.8;font-size:13px}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;box-shadow:0 6px 16px rgba(22,135,248,.18)}
.secondary{background:#eef6ff;border:0;color:#0876df;padding:11px 15px;border-radius:12px;font-weight:750}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.volume{background:#fff;border:1px solid var(--line);border-radius:13px;margin:10px 0;overflow:hidden;box-shadow:0 4px 14px rgba(35,85,125,.035)}
.volume-head{padding:15px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.volume-title{font-size:16px;font-weight:850}
.volume-head>span:last-child{font-size:12px;color:var(--muted)}
.chapter-list{border-top:1px solid var(--line)}
.chapter{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);cursor:pointer}
.chapter:last-child{border-bottom:0}
.chapter-main{flex:1;min-width:0}
.chapter-name{font-weight:800;font-size:15px}
.chapter-desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.chapter-count{font-size:11px;color:var(--muted);white-space:nowrap}
.editor{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:#66717d;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1px solid #dce6ef;border-radius:12px;padding:12px;background:#fff}
.field textarea{min-height:280px;line-height:1.8;resize:vertical}
.reader{min-height:100vh;background:var(--paper)}
.reader .topbar{background:rgba(255,253,248,.96)}
.reader-body{max-width:900px;margin:auto;padding:24px 24px 150px}
.reader-text{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:21px;line-height:2.05;letter-spacing:.03em;white-space:pre-wrap}
.reader-text.vertical{writing-mode:vertical-rl;text-orientation:mixed;line-height:1.9;letter-spacing:.05em;overflow-x:auto;max-width:100%;height:calc(100vh - 215px);white-space:pre-wrap}
.reader-controls{position:fixed;z-index:30;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:430px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:7px;display:flex;justify-content:space-around;gap:3px;box-shadow:var(--shadow)}
.reader-controls button{padding:9px 8px;border-radius:11px;font-size:13px}
.reader-controls button.active{background:#eaf4ff;color:var(--accent);font-weight:800}
.modal-back{position:fixed;inset:0;background:rgba(13,32,48,.42);z-index:100;display:flex;align-items:flex-end}
.modal{background:#fff;width:100%;max-height:88vh;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));overflow:auto}
.modal h2{margin:0 0 18px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.danger{color:#d33;background:#fff1f1}
.search{width:100%;padding:13px 15px;border:1px solid #dce7ef;border-radius:13px;background:#fff;margin-bottom:18px;outline:none}
.search:focus{border-color:#9ccfff;box-shadow:0 0 0 3px #e8f4ff}
.small{font-size:13px;color:var(--muted)}
.navback{font-size:15px;font-weight:800;color:var(--accent);white-space:nowrap}
.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.97);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:50}
.bottom button{width:33%;font-size:11px;color:#6c7782}
.bottom .big{font-size:22px;display:block;margin-bottom:2px;color:var(--accent)}
@media(max-width:420px){
 .page{padding:14px 14px 108px}
 .filters{margin:0 -14px 17px;padding:0 14px}
 .detail-head{grid-template-columns:120px 1fr;gap:15px}
 .detail-name{font-size:21px}
 .primary,.secondary{padding:11px 13px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="my-books-v1";
const defaultData={
 books:[
  {id:"book1",title:"サンプル小説",cover:"",volumes:[
   {id:"v1",name:"第1巻",chapters:[
    {id:"c1",title:"Chapter 01",text:"「これはサンプルの文章です。」\\n\\nジェギョンは静かに窓の外を見た。\\n「今日は寒いね。」\\n「そうだな。」"}
   ]}
  ]},
  {id:"book2",title:"ホンブル",cover:"",volumes:[
   {id:"v1",name:"第1巻",chapters:[
    {id:"c1",title:"Chapter 01",text:"「サンプルの会話文です。」\\n\\nここから地の文が続きます。"}
   ]}
  ]}
 ]
};
let data;
try { data=JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e) { data=null; }
function normalizeData(d){
  if(!d || !Array.isArray(d.books)) return structuredClone(defaultData);
  d.books=d.books.map((b,i)=>({
    id:b.id||uid("b"), title:b.title||`作品${i+1}`, cover:b.cover||"",
    volumes:Array.isArray(b.volumes)?b.volumes.map((v,j)=>({
      id:v.id||uid("v"), name:v.name||`第${j+1}巻`,
      chapters:Array.isArray(v.chapters)?v.chapters.map((c,k)=>({
        id:c.id||uid("c"), title:c.title||`Chapter ${String(k+1).padStart(2,"0")}`, text:typeof c.text==="string"?c.text:""
      })):[]
    })):[]
  }));
  return d;
}
data=normalizeData(data);
let state={screen:"shelf",bookId:null,volumeId:null,chapterId:null,vertical:false,search:""};

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function book(){return data.books.find(x=>x.id===state.bookId)}
function volume(){return book()?.volumes.find(x=>x.id===state.volumeId)}
function chapter(){return volume()?.chapters.find(x=>x.id===state.chapterId)}
function count(s){return [...(s||"")].filter(c=>!/\s/.test(c)).length}
function totalBook(b){return b.volumes.reduce((a,v)=>a+v.chapters.reduce((x,c)=>x+count(c.text),0),0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function coverHTML(b,cls=""){return b.cover?`<div class="cover ${cls}"><img src="${esc(b.cover)}"></div>`:`<div class="cover placeholder ${cls}"><span>${esc(b.title)}</span></div>`}
function shell(content,reader=false){
 document.getElementById("app").innerHTML=reader?`<div class="reader">${content}</div>`:`<div class="app">${content}</div>`;
}
function top(title,left="",right=""){
 return `<div class="topbar"><div class="topbar-inner">
 <button class="navback" onclick="${left}">${left?'‹ 戻る':''}</button>
 <div class="title-center">${esc(title)}</div>
 <div class="row" style="flex:0 0 auto">${right}</div>
 </div></div>`;
}
function renderShelf(){
 let list=data.books.filter(b=>b.title.toLowerCase().includes(state.search.toLowerCase()));
 shell(`
 ${top("本棚","","<button class='iconbtn' onclick='openSearch()'>⌕</button><button class='iconbtn' onclick='newBook()'>＋</button>")}
 <main class="page">
  <div class="filters"><button class="pill active">本棚</button><button class="pill">未読</button><button class="pill">読書中</button><button class="pill">読了</button></div>
  <input id="searchBox" class="search hidden" placeholder="作品を検索" oninput="state.search=this.value;renderShelf()" value="${esc(state.search)}">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0 13px"><strong style="font-size:18px">マイライブラリ</strong><span class="small">${list.length}作品</span></div>
  ${list.length?`<div class="grid">${list.map(b=>`<article class="book" onclick="openBook('${b.id}')">
   ${coverHTML(b)}
   <div class="book-name">${esc(b.title)}</div>
   <div class="book-meta">${b.volumes.length}巻　${totalBook(b).toLocaleString()}文字</div>
  </article>`).join("")}</div>`:`<div class="empty">本がありません<br><br><button class="primary" onclick="newBook()">＋ 本を追加</button></div>`}
 </main>
 <div class="bottom"><button onclick="renderShelf()"><span class="big">⌂</span>本棚</button><button onclick="newBook()"><span class="big">＋</span>追加</button><button onclick="openSettings()"><span class="big">⚙</span>設定</button></div>
 `);
}
function openSearch(){let e=document.getElementById("searchBox"); if(e){e.classList.toggle("hidden");e.focus()} else {renderShelf();setTimeout(()=>{document.getElementById("searchBox")?.classList.remove("hidden");document.getElementById("searchBox")?.focus()},0)}}
function openBook(id){state.bookId=id;state.screen="detail";renderDetail()}
function renderDetail(){
 const b=book();
 shell(`
 ${top(b.title,`renderShelf()`,"<button class='secondary' onclick='editBook()'>編集</button>")}
 <main class="page">
  <div class="detail-head">${coverHTML(b)}<div>
   <div class="detail-name">${esc(b.title)}</div>
   <div class="detail-stat">${b.volumes.length}巻<br>総文字数 ${totalBook(b).toLocaleString()}文字</div>
  </div></div>
  <div class="actions" style="margin-top:18px"><button class="primary" style="width:100%;font-size:16px" onclick="continueReading()">▣　続きを読む</button></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:24px"><div class="section-title" style="margin:0">巻一覧</div><button class="secondary" onclick="addVolume()">＋ 巻を追加</button></div>
  ${b.volumes.map((v,vi)=>`<section class="volume">
   <div class="volume-head" onclick="toggleVolume('${v.id}')"><span class="volume-title">${esc(v.name)}</span><span>${v.chapters.length}章　${v.chapters.reduce((a,c)=>a+count(c.text),0).toLocaleString()}文字　⌄</span></div>
   <div id="vol-${v.id}" class="chapter-list">${v.chapters.map((c,ci)=>`<div class="chapter" onclick="openChapter('${v.id}','${c.id}')">
    <div class="chapter-main"><div class="chapter-name">${esc(c.title||`Chapter ${String(ci+1).padStart(2,"0")}`)}</div><div class="chapter-desc">${esc(c.text.slice(0,70))}</div></div>
    <div class="chapter-count">${count(c.text).toLocaleString()}文字　›</div>
   </div>`).join("")}<div style="padding:14px 18px"><button class="secondary" onclick="event.stopPropagation();addChapter('${v.id}')">＋ チャプター追加</button></div></div>
  </section>`).join("")}
 </main>
 `);
}
function toggleVolume(id){let e=document.getElementById("vol-"+id);if(e)e.classList.toggle("hidden")}
function continueReading(){let b=book();let v=b.volumes[0],c=v?.chapters[0];if(c)openChapter(v.id,c.id)}
function openChapter(vid,cid){state.volumeId=vid;state.chapterId=cid;renderReader()}
function renderReader(){
 const c=chapter(); const v=volume(); const b=book();
 shell(`
 ${top(c.title||"Chapter",`renderDetail()`,`<button class="secondary" onclick="editChapter()">編集</button>`)}
 <div class="reader-body"><div id="readerText" class="reader-text ${state.vertical?'vertical':''}">${esc(c.text)}</div></div>
 <div class="reader-controls">
  <button class="${!state.vertical?'active':''}" onclick="setDirection(false)">横書き</button>
  <button class="${state.vertical?'active':''}" onclick="setDirection(true)">縦書き</button>
  <button onclick="font(-1)">A−</button><button onclick="font(1)">A＋</button>
  <button onclick="openReaderSettings()">設定</button>
 </div>
 `,true);
}
function setDirection(v){state.vertical=v;renderReader()}
function font(delta){let e=document.getElementById("readerText");if(!e)return;let n=parseFloat(getComputedStyle(e).fontSize)+delta;e.style.fontSize=Math.max(14,Math.min(34,n))+"px";localStorage.setItem("my-books-font",n)}
function openReaderSettings(){modal(`<h2>読書設定</h2><div class="field"><label>表示方向</label><div class="row"><button class="secondary" onclick="setDirection(false);closeModal()">横書き</button><button class="secondary" onclick="setDirection(true);closeModal()">縦書き</button></div></div><div class="field"><label>文字サイズ</label><div class="row"><button class="secondary" onclick="font(-1);closeModal()">A−</button><button class="secondary" onclick="font(1);closeModal()">A＋</button></div></div><button class="secondary" onclick="closeModal()">閉じる</button>`)}
function editChapter(){
 const c=chapter();
 modal(`<h2>チャプター編集</h2><div class="field"><label>タイトル</label><input id="ec-title" value="${esc(c.title)}"></div><div class="field"><label>本文　${count(c.text).toLocaleString()}文字</label><textarea id="ec-text">${esc(c.text)}</textarea></div>
 <div class="actions"><button class="primary" onclick="saveChapterEdit()">保存</button><button class="secondary danger" onclick="deleteChapter()">削除</button><button class="secondary" onclick="closeModal()">キャンセル</button></div>`)
}
function saveChapterEdit(){let c=chapter();c.title=document.getElementById("ec-title").value;c.text=document.getElementById("ec-text").value;save();closeModal();renderReader()}
function deleteChapter(){if(!confirm("このチャプターを削除しますか？"))return;let v=volume();v.chapters=v.chapters.filter(c=>c.id!==state.chapterId);v.chapters.forEach((c,i)=>c.title=`Chapter ${String(i+1).padStart(2,"0")}`);save();closeModal();state.chapterId=null;renderDetail()}
function addChapter(vid){let v=book().volumes.find(x=>x.id===vid);v.chapters.push({id:uid("c"),title:`Chapter ${String(v.chapters.length+1).padStart(2,"0")}`,text:""});save();renderDetail()}
function addVolume(){let b=book();b.volumes.push({id:uid("v"),name:`第${b.volumes.length+1}巻`,chapters:[]});save();renderDetail()}
function editBook(){let b=book();modal(`<h2>作品編集</h2><div class="field"><label>作品タイトル</label><input id="eb-title" value="${esc(b.title)}"></div><div class="field"><label>表紙画像URL（任意）</label><input id="eb-cover" value="${esc(b.cover)}" placeholder="画像URL"></div><div class="actions"><button class="primary" onclick="saveBookEdit()">保存</button><button class="secondary danger" onclick="deleteBook()">作品を削除</button><button class="secondary" onclick="closeModal()">キャンセル</button></div>`)}
function saveBookEdit(){let b=book();b.title=document.getElementById("eb-title").value.trim()||b.title;b.cover=document.getElementById("eb-cover").value.trim();save();closeModal();renderDetail()}
function deleteBook(){if(!confirm("作品を削除しますか？"))return;data.books=data.books.filter(b=>b.id!==state.bookId);save();closeModal();renderShelf()}
function newBook(){modal(`<h2>本を追加</h2><div class="field"><label>作品タイトル</label><input id="nb-title" placeholder="作品名"></div><div class="field"><label>表紙画像URL（任意）</label><input id="nb-cover" placeholder="画像URL"></div><button class="primary" onclick="createBook()">追加</button> <button class="secondary" onclick="closeModal()">キャンセル</button>`)}
function createBook(){let title=document.getElementById("nb-title").value.trim()||"新しい小説";data.books.push({id:uid("b"),title,cover:document.getElementById("nb-cover").value.trim(),volumes:[]});save();closeModal();renderShelf()}
function openSettings(){modal(`<h2>設定</h2><div class="field"><label>読書表示</label><div class="small">リーダーでは横書き・縦書きを切り替えられます。</div></div><div class="field"><label>データ</label><button class="secondary" onclick="exportData()">データを書き出す</button> <button class="secondary" onclick="importData()">データを読み込む</button></div><button class="secondary" onclick="closeModal()">閉じる</button>`)}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="my-books-backup.json";a.click()}
function importData(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();closeModal();renderShelf()}catch(e){alert("読み込みに失敗しました")}};r.readAsText(f)};i.click()}
function modal(html){let d=document.createElement("div");d.id="modal";d.className="modal-back";d.innerHTML=`<div class="modal">${html}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d)}
function closeModal(){document.getElementById("modal")?.remove()}
renderShelf();
if("serviceWorker"in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
