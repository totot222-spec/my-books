<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fcff">
<title>My Books v1.2</title>

<style>
:root{
  --accent:#1686e8;
  --accent2:#eaf6ff;
  --bg:#f7fbfe;
  --paper:#fffefa;
  --text:#202124;
  --muted:#818994;
  --line:#e2eaf0;
  --card:#ffffff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- HEADER ---------- */

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(250,253,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px);
}

.topin{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.ttl{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  font-weight:800;
  white-space:nowrap;
  max-width:50%;
  overflow:hidden;
  text-overflow:ellipsis;
}

.back{
  font-size:16px;
  color:var(--accent);
  font-weight:700;
}

.headright{
  display:flex;
  gap:8px;
  align-items:center;
}

.iconbtn{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 3px 14px #315b7412;
  font-size:22px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.editbtn{
  color:var(--accent);
  font-weight:700;
  padding:10px;
}

/* ---------- COMMON ---------- */

.page{
  max-width:960px;
  margin:auto;
  padding:20px 18px 110px;
}

.sectiontitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:28px 0 15px;
}

.sectiontitle h2{
  margin:0;
  font-size:20px;
}

.mini{
  font-size:13px;
  color:var(--accent);
  font-weight:700;
}

.primary,.secondary,.soft,.dangerbtn{
  padding:12px 17px;
  border-radius:13px;
  font-weight:700;
}

.primary{
  background:var(--accent);
  color:white;
}

.secondary{
  background:white;
  border:1px solid var(--line);
}

.soft{
  background:var(--accent2);
  color:var(--accent);
}

.dangerbtn{
  background:#fff1f1;
  color:#d94747;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

/* ---------- SHELF ---------- */

.shelfhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:3px 0 19px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{display:none}

.pill{
  border:1px solid #dce6ed;
  background:white;
  border-radius:999px;
  padding:9px 17px;
  white-space:nowrap;
  font-size:14px;
}

.pill.on{
  border-color:var(--accent);
  color:var(--accent);
  background:#f5fbff;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px 14px;
}

@media(max-width:390px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(min-width:760px){
  .grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
}

.book{cursor:pointer;min-width:0}

.cover{
  aspect-ratio:2/3;
  border-radius:7px;
  overflow:hidden;
  background:
    linear-gradient(145deg,#9bd5f3,#dff4ff 55%,#83badc);
  box-shadow:0 7px 20px #41647c20;
  display:flex;
  align-items:flex-end;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.cover span{
  padding:13px;
  color:#fff;
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-weight:700;
  font-size:18px;
  white-space:pre-line;
  text-shadow:0 2px 8px #0005;
}

.bn{
  font-weight:750;
  font-size:15px;
  margin-top:9px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

/* ---------- DETAIL ---------- */

.detailhero{
  background:#fff;
  margin:-20px -18px 0;
  padding:25px 18px 28px;
  border-bottom:1px solid var(--line);
}

.detail{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:20px;
  align-items:start;
}

.detail .cover{
  box-shadow:0 8px 22px #23445a20;
}

.dname{
  font-size:25px;
  font-weight:850;
  margin:2px 0 7px;
}

.author{
  color:var(--muted);
  margin-bottom:13px;
}

.stats{
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
}

.continue{
  width:100%;
  margin-top:19px;
  background:var(--accent);
  color:#fff;
  border-radius:12px;
  padding:14px;
  font-weight:750;
  font-size:16px;
}

.vol{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin:12px 0;
  box-shadow:0 2px 10px #315b7408;
}

.vh{
  padding:16px 17px;
  font-size:17px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.vcount{
  color:var(--muted);
  font-size:12px;
  font-weight:500;
  align-self:center;
}

.ch{
  padding:15px 17px;
  border-top:1px solid var(--line);
  display:flex;
  gap:10px;
  align-items:center;
}

.cm{flex:1;min-width:0}

.ct{font-weight:700}

.preview{
  font-size:13px;
  color:#89919a;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:5px;
}

.cc{
  font-size:12px;
  color:#9aa1a8;
  white-space:nowrap;
}

/* ---------- READER ---------- */

.reader{
  min-height:100vh;
  background:var(--paper);
  --reader-size:20px;
  --reader-line:2;
  --reader-pad:26px;
}

.reader.dark{
  background:#17191c;
  color:#eee;
}

.reader.dark .readtop{
  background:rgba(23,25,28,.95);
  border-color:#333;
}

.reader.dark .readerbar{
  background:rgba(28,30,33,.96);
  border-color:#444;
}

.reader.dark .readerbar button{
  color:#eee;
}

.readtop{
  position:fixed;
  left:0;
  right:0;
  top:0;
  z-index:30;
  height:68px;
  background:rgba(255,254,250,.96);
  border-bottom:1px solid #eee;
  backdrop-filter:blur(14px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  transition:.2s;
}

.readtop.hidebar{
  transform:translateY(-110%);
}

.readtitle{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-weight:750;
  font-size:17px;
  max-width:55%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.readside{
  display:flex;
  gap:5px;
  align-items:center;
}

.readerback{
  font-size:16px;
  padding:10px 4px;
}

.readicon{
  font-size:21px;
  width:40px;
  height:40px;
}

.rb{
  max-width:850px;
  margin:auto;
  min-height:100vh;
  padding:
    calc(88px + env(safe-area-inset-top))
    var(--reader-pad)
    150px;
}

.text{
  font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  font-size:var(--reader-size);
  line-height:var(--reader-line);
  letter-spacing:.035em;
  white-space:pre-wrap;
  word-break:normal;
  overflow-wrap:anywhere;
}

.text.vert{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  height:calc(100vh - 165px);
  width:max-content;
  max-width:none;
  overflow:visible;
  line-height:var(--reader-line);
}

.rb.verticalwrap{
  max-width:none;
  overflow-x:auto;
  overflow-y:hidden;
  padding-left:60px;
  padding-right:60px;
}

.readerbar{
  position:fixed;
  z-index:35;
  left:50%;
  bottom:calc(14px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  display:flex;
  gap:3px;
  padding:6px;
  background:rgba(255,255,255,.94);
  border:1px solid #e0e4e7;
  border-radius:18px;
  backdrop-filter:blur(16px);
  box-shadow:0 5px 25px #00000012;
  white-space:nowrap;
  transition:.2s;
}

.readerbar.hidebar{
  transform:translate(-50%,150%);
}

.readerbar button{
  padding:9px 11px;
  border-radius:11px;
  font-size:14px;
}

.readerbar .on{
  background:var(--accent2);
  color:var(--accent);
}

.progress{
  position:fixed;
  bottom:0;
  left:0;
  height:3px;
  background:var(--accent);
  z-index:40;
  width:0;
}

/* ---------- MODAL ---------- */

.modalback{
  position:fixed;
  inset:0;
  background:#0006;
  z-index:100;
  display:flex;
  align-items:flex-end;
}

.modal{
  width:100%;
  max-height:91vh;
  overflow:auto;
  background:#fff;
  border-radius:25px 25px 0 0;
  padding:22px 20px calc(25px + env(safe-area-inset-bottom));
}

.modal h2{
  margin:5px 0 20px;
}

.field{
  margin:15px 0;
}

.field label{
  display:block;
  font-size:13px;
  color:#69727b;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #dce3e8;
  border-radius:11px;
  background:#fff;
}

.field textarea{
  height:310px;
  line-height:1.75;
  resize:vertical;
}

.settingrow{
  padding:15px 0;
  border-bottom:1px solid #edf0f2;
}

.settingtitle{
  font-weight:700;
  margin-bottom:11px;
}

.segment{
  display:flex;
  background:#f1f4f6;
  padding:4px;
  border-radius:12px;
}

.segment button{
  flex:1;
  padding:10px;
  border-radius:9px;
}

.segment button.on{
  background:#fff;
  color:var(--accent);
  font-weight:700;
  box-shadow:0 1px 6px #0001;
}

.range{
  width:100%;
  accent-color:var(--accent);
}

.toolcard{
  background:#f6faff;
  border:1px solid #e0edf6;
  border-radius:15px;
  padding:15px;
  margin:14px 0;
}

.toolcard h3{
  margin:0 0 8px;
  font-size:16px;
}

.toolcard p{
  margin:0 0 12px;
  color:#74808a;
  font-size:13px;
  line-height:1.6;
}

.note{
  font-size:12px;
  color:#89929a;
  line-height:1.6;
}

</style>
</head>

<body>
<div id="app"></div>

<script>
"use strict";

/* =========================================================
   DATA
========================================================= */

const KEY="my-books-v11";
const SETKEY="my-books-reader-v12";
const POSKEY="my-books-position-v12";

const sample={
  books:[
    {
      id:"b1",
      title:"サンプル小説",
      cover:"",
      volumes:[
        {
          id:"v1",
          name:"第1巻",
          chapters:[
            {
              id:"c1",
              title:"Chapter 01",
              text:"「これはサンプルの文章です。」\nジェギョンは静かに窓の外を見た。\n「今日は寒いね。」\n「そうだな。」"
            }
          ]
        }
      ]
    },
    {
      id:"b2",
      title:"ホンブル",
      cover:"",
      volumes:[
        {
          id:"v1",
          name:"第1巻",
          chapters:[
            {
              id:"c1",
              title:"Chapter 01",
              text:"「サンプルの会話文です。」\nここから地の文が続きます。"
            }
          ]
        }
      ]
    }
  ]
};

let data;

try{
  data=JSON.parse(localStorage.getItem(KEY))||sample;
}catch(e){
  data=sample;
}

let settings={
  vertical:false,
  fontSize:20,
  lineHeight:2,
  padding:26,
  dark:false
};

try{
  settings={
    ...settings,
    ...(JSON.parse(localStorage.getItem(SETKEY))||{})
  };
}catch(e){}

let st={
  book:null,
  vol:null,
  ch:null,
  menu:true
};

const $=s=>document.querySelector(s);

const esc=s=>String(s??"").replace(
  /[&<>"']/g,
  m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#39;"
  }[m])
);

const chars=s=>[...(s||"")].filter(x=>!/\s/.test(x)).length;

const save=()=>{
  localStorage.setItem(KEY,JSON.stringify(data));
};

const saveSettings=()=>{
  localStorage.setItem(SETKEY,JSON.stringify(settings));
};

const B=()=>data.books.find(x=>x.id===st.book);

const V=()=>B()?.volumes.find(x=>x.id===st.vol);

const C=()=>V()?.chapters.find(x=>x.id===st.ch);

const id=p=>
  p+
  Date.now().toString(36)+
  Math.random().toString(36).slice(2,6);

function bcount(b){
  return (b.volumes||[]).reduce(
    (n,v)=>
      n+
      (v.chapters||[]).reduce(
        (a,c)=>a+chars(c.text),
        0
      ),
    0
  );
}

/* =========================================================
   COVER
========================================================= */

function cover(b){
  if(b.cover){
    return `
      <div class="cover">
        <img src="${esc(b.cover)}" alt="">
      </div>
    `;
  }

  return `
    <div class="cover">
      <span>${esc(b.title)}</span>
    </div>
  `;
}

/* =========================================================
   HEADER
========================================================= */

function top(title,back,right=""){
  return `
    <div class="top">
      <div class="topin">

        <button class="back"
          onclick="${back||""}">
          ${back?"‹ 戻る":""}
        </button>

        <div class="ttl">
          ${esc(title)}
        </div>

        <div class="headright">
          ${right}
        </div>

      </div>
    </div>
  `;
}

/* =========================================================
   MODAL
========================================================= */

function modal(x){
  let d=document.createElement("div");

  d.id="modal";
  d.className="modalback";

  d.innerHTML=`
    <div class="modal">
      ${x}
    </div>
  `;

  d.onclick=e=>{
    if(e.target===d)closeM();
  };

  document.body.appendChild(d);
}

function closeM(){
  $("#modal")?.remove();
}

/* =========================================================
   SHELF
========================================================= */

function shelf(){

  st.book=null;
  st.vol=null;
  st.ch=null;

  $("#app").innerHTML=`

    ${top(
      "本棚",
      "",
      `
        <button class="iconbtn"
          onclick="searchBooks()">⌕</button>

        <button class="iconbtn"
          onclick="newBook()">＋</button>
      `
    )}

    <main class="page">

      <div class="filters">
        <button class="pill on">本棚</button>
        <button class="pill">未読</button>
        <button class="pill">読書中</button>
        <button class="pill">読了</button>
      </div>

      <div class="sectiontitle">
        <h2>マイライブラリ</h2>
        <span class="mini">
          ${data.books.length}作品
        </span>
      </div>

      <div class="grid">

        ${data.books.map(b=>`

          <div class="book"
            onclick="detail('${b.id}')">

            ${cover(b)}

            <div class="bn">
              ${esc(b.title)}
            </div>

            <div class="meta">
              ${(b.volumes||[]).length}巻
            </div>

          </div>

        `).join("")}

      </div>

    </main>
  `;
}

/* =========================================================
   SEARCH
========================================================= */

function searchBooks(){

  modal(`
    <h2>本を検索</h2>

    <div class="field">
      <input
        id="bookSearch"
        placeholder="作品タイトル"
        oninput="runBookSearch()">
    </div>

    <div id="searchResults"></div>

    <div class="actions">
      <button class="secondary"
        onclick="closeM()">
        閉じる
      </button>
    </div>
  `);

  runBookSearch();
}

function runBookSearch(){

  const q=$("#bookSearch")?.value.trim().toLowerCase()||"";

  const results=data.books.filter(
    b=>!q||b.title.toLowerCase().includes(q)
  );

  $("#searchResults").innerHTML=
    results.map(b=>`
      <button
        style="
          display:block;
          width:100%;
          text-align:left;
          padding:15px 5px;
          border-bottom:1px solid #eee
        "
        onclick="
          closeM();
          detail('${b.id}')
        ">
        <b>${esc(b.title)}</b>
        <div class="meta">
          ${b.volumes.length}巻
          ・
          ${bcount(b).toLocaleString()}文字
        </div>
      </button>
    `).join("");
}

/* =========================================================
   BOOK DETAIL
========================================================= */

function detail(bid){

  if(bid)st.book=bid;

  let b=B();

  if(!b)return shelf();

  $("#app").innerHTML=`

    ${top(
      b.title,
      "shelf()",
      `
        <button class="editbtn"
          onclick="editBook()">
          編集
        </button>
      `
    )}

    <main class="page">

      <div class="detailhero">

        <div class="detail">

          ${cover(b)}

          <div>

            <div class="dname">
              ${esc(b.title)}
            </div>

            <div class="author">
              マイライブラリ
            </div>

            <div class="stats">
              ${b.volumes.length}巻
              <br>
              ${bcount(b).toLocaleString()}文字
            </div>

          </div>

        </div>

        <button class="continue"
          onclick="cont()">
          ▱　続きを読む
        </button>

      </div>

      <div class="sectiontitle">

        <h2>巻一覧</h2>

        <button class="soft"
          onclick="addVol()">
          ＋ 巻を追加
        </button>

      </div>

      ${b.volumes.map(v=>`

        <div class="vol">

          <div class="vh">

            <span>${esc(v.name)}</span>

            <span class="vcount">
              ${v.chapters.length} chapters
              ・
              ${v.chapters.reduce(
                (a,c)=>a+chars(c.text),
                0
              ).toLocaleString()}文字
            </span>

          </div>

          ${v.chapters.map((c,i)=>`

            <div class="ch"
              onclick="reader('${v.id}','${c.id}')">

              <div class="cm">

                <div class="ct">
                  ${esc(
                    c.title||
                    "Chapter "+
                    String(i+1).padStart(2,"0")
                  )}
                </div>

                <div class="preview">
                  ${esc(
                    c.text
                      .replace(/\s+/g," ")
                      .slice(0,75)
                  )}
                </div>

              </div>

              <div class="cc">
                ${chars(c.text).toLocaleString()}文字
                ›
              </div>

            </div>

          `).join("")}

          <div class="ch">

            <button class="soft"
              onclick="addCh('${v.id}')">
              ＋ チャプター追加
            </button>

          </div>

        </div>

      `).join("")}

    </main>
  `;
}

/* =========================================================
   CONTINUE
========================================================= */

function cont(){

  let b=B();

  if(!b)return;

  let last=null;

  try{
    last=JSON.parse(
      localStorage.getItem(POSKEY)
    );
  }catch(e){}

  if(
    last &&
    last.book===b.id
  ){

    const v=b.volumes.find(
      x=>x.id===last.vol
    );

    const c=v?.chapters.find(
      x=>x.id===last.ch
    );

    if(v&&c){
      reader(v.id,c.id);
      return;
    }
  }

  let v=b.volumes?.[0];
  let c=v?.chapters?.[0];

  if(c)reader(v.id,c.id);
}

/* =========================================================
   READER
========================================================= */

function reader(vid,cid){

  if(vid)st.vol=vid;
  if(cid)st.ch=cid;

  let c=C();

  if(!c)return detail();

  st.menu=true;

  $("#app").innerHTML=`

    <div
      id="readerRoot"
      class="reader ${settings.dark?"dark":""}"
      style="
        --reader-size:${settings.fontSize}px;
        --reader-line:${settings.lineHeight};
        --reader-pad:${settings.padding}px;
      "
    >

      <div id="readTop" class="readtop">

        <button class="readerback"
          onclick="savePosition();detail()">
          ‹ 戻る
        </button>

        <div class="readtitle">
          ${esc(c.title||"Chapter")}
        </div>

        <div class="readside">

          <button class="readicon"
            onclick="editCh()">
            ✎
          </button>

        </div>

      </div>

      <div
        id="readerScroll"
        class="rb ${settings.vertical?"verticalwrap":""}"
        onclick="readerTap(event)"
      >

        <div
          id="txt"
          class="text ${settings.vertical?"vert":""}"

/* =========================================================

========================================================= */

function changeFont(delta){

  settings.fontSize=Math.max(
    14,
    Math.min(
      34,
      settings.fontSize+delta
    )
  );

  saveSettings();

  const root=$("#readerRoot");

  if(root){
    root.style.setProperty(
      "--reader-size",
      settings.fontSize+"px"
    );
  }
}

/* =========================================================
   POSITION
========================================================= */

function savePosition(){

  if(!st.book||!st.vol||!st.ch)return;

  let el=$("#readerScroll");

  let position=0;

  if(el){

    position=settings.vertical
      ?Math.abs(el.scrollLeft)
      :window.scrollY;

  }

  localStorage.setItem(
    POSKEY,
    JSON.stringify({
      book:st.book,
      vol:st.vol,
      ch:st.ch,
      vertical:settings.vertical,
      position
    })
  );
}

function restorePosition(){

  let p;

  try{
    p=JSON.parse(
      localStorage.getItem(POSKEY)
    );
  }catch(e){
    return;
  }

  if(
    !p ||
    p.book!==st.book ||
    p.vol!==st.vol ||
    p.ch!==st.ch ||
    p.vertical!==settings.vertical
  )return;

  setTimeout(()=>{

    if(settings.vertical){

      const el=$("#readerScroll");

      if(el){
        el.scrollLeft=-p.position;
      }

    }else{

      window.scrollTo(
        0,
        p.position||0
      );

    }

  },80);
}

function bindReaderScroll(){

  const el=$("#readerScroll");

  if(settings.vertical){

    el?.addEventListener(
      "scroll",
      ()=>{
        updateProgress();
        savePosition();
      },
      {passive:true}
    );

  }else{

    window.onscroll=()=>{
      updateProgress();
      savePosition();
    };

  }

  updateProgress();
}

function updateProgress(){

  let pct=0;

  if(settings.vertical){

    const el=$("#readerScroll");

    if(el){

      const max=
        el.scrollWidth-
        el.clientWidth;

      pct=max>0
        ?Math.abs(el.scrollLeft)/max*100
        :0;
    }

  }else{

    const max=
      document.documentElement.scrollHeight-
      window.innerHeight;

    pct=max>0
      ?window.scrollY/max*100
      :0;
  }

  const p=$("#progress");

  if(p){
    p.style.width=
      Math.max(
        0,
        Math.min(100,pct)
      )+"%";
  }
}

function scrollTopReader(){

  if(settings.vertical){

    const el=$("#readerScroll");

    if(el){
      el.scrollTo({
        left:0,
        behavior:"smooth"
      });
    }

  }else{

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
}

/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(text){

  return String(text||"")
    .replace(/\r\n?/g,"\n")
    .replace(/[ \t]+\n/g,"\n")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

/* =========================================================
   DIALOG FORMATTER
========================================================= */

function formatDialogue(text){

  let s=normalizeText(text);

  /*
    ① 」「 が連続する会話
       → 改行
  */

  s=s.replace(
    /」[ \t]*「/g,
    "」\n「"
  );

  /*
    ② 」の後ろにすぐ新しい「がある場合
       → 改行

       例:
       「A。」 「B。」
  */

  s=s.replace(
    /」[ \t]+(?=「)/g,
    "」\n"
  );

  /*
    ③ 行の途中で「が始まる場合。

       ただし
       「君」は
       「彼」という
       のような引用表現を壊さないため、
       開き括弧の前が句点などの場合だけ処理。
  */

  s=s.replace(
    /([。！？!?])[\u3000 \t]+(?=「)/g,
    "$1\n「"
  );

  /*
    ④ 会話文の閉じ括弧の後に
       地の文が直接続いているケース。

       「こんにちは。」彼は笑った。
           ↓
       「こんにちは。」
       彼は笑った。

       ただし
       「君」は〜
       「彼」と〜
       「好き」という〜
       のような文中引用は除外。
  */

  s=s.replace(
    /(^|\n)(「[^\n「」]{2,}」)[ \t]*(?=([^「\n]))/g,
    (all,start,quote,next)=>{

      const after=all.slice(
        start.length+
        quote.length
      );

      const following=
        s.slice(
          s.indexOf(all)+all.length
        );

      if(
        /^[はがをにへとでのもや]/.test(
          following.trimStart()
        )
      ){
        return all;
      }

      return start+quote+"\n";
    }
  );

  /*
    ⑤ 空行整理
  */

  s=s
    .replace(/\n[ \t]+/g,"\n")
    .replace(/\n{3,}/g,"\n\n");

  return s.trim();
}

function formatCurrentTextarea(){

  const ta=$("#ecx");

  if(!ta)return;

  const before=ta.value;

  const after=formatDialogue(before);

  ta.value=after;

  alert("会話文の整形を適用しました。保存する前に本文を確認してください。");
}

/* =========================================================
   REPLACE
========================================================= */

function replaceTool(){

  const current=$("#ecx")?.value||"";

  modalReplace(current);
}

function modalReplace(current){

  closeM();

  modal(`

    <h2>Chapter 一括置換</h2>

    <div class="field">

      <label>
        検索する文字
      </label>

      <input
        id="findText"
        placeholder="例：RIDI">

    </div>

    <div class="field">

      <label>
        置換後の文字
      </label>

      <input
        id="replaceText"
        placeholder="空欄なら削除">

    </div>

    <p class="note">
      このChapterだけに適用されます。
      大文字・小文字も区別します。
    </p>

    <div class="actions">

      <button class="primary"
        onclick="executeReplace()">
        置き換える
      </button>

      <button class="secondary"
        onclick="closeM();editCh()">
        戻る
      </button>

    </div>

  `);

  window.__editBuffer=current;
}

function executeReplace(){

  const find=$("#findText").value;

  const rep=$("#replaceText").value;

  if(!find){
    alert("検索する文字を入力してください。");
    return;
  }

  const source=
    window.__editBuffer ??
    C().text;

  const count=
    source.split(find).length-1;

  if(count===0){
    alert("一致する文字がありません。");
    return;
  }

  const result=
    source.split(find).join(rep);

  window.__editBuffer=result;

  closeM();

  editCh();

  $("#ecx").value=result;

  alert(
    count+
    "か所を置き換えました。"
  );
}

   DELETE CHAPTER
========================================================= */

function delCh(){

  if(
    !confirm(
      "このチャプターを削除しますか？"
    )
  )return;

  let v=V();

  v.chapters=
    v.chapters.filter(
      x=>x.id!==st.ch
    );

  v.chapters.forEach(
    (c,i)=>{
      if(/^Chapter \d+$/i.test(c.title)){
        c.title=
          `Chapter ${
            String(i+1).padStart(2,"0")
          }`;
      }
    }
  );

  save();

  closeM();

  detail();
}
